<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>⚔️ Survival Roguelike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; }
  canvas { display: block; touch-action: none; }
  /* HUD */
  .hud { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; padding: 10px 20px; display: flex; gap: 20px; align-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent); pointer-events: none; z-index: 10; }
  .bar-wrap { flex: 1; max-width: 300px; }
  .bar-label { font-size: 12px; margin-bottom: 2px; }
  .bar { height: 16px; background: #1a1a2e; border-radius: 8px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; transition: width 0.2s; }
  .bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
  #hpFill { background: linear-gradient(90deg, #e63946, #ff6b6b); }
  #xpFill { background: linear-gradient(90deg, #7ae582, #4ade80); }
  #stageInfo { font-size: 14px; white-space: nowrap; }
  #timer { font-size: 14px; white-space: nowrap; }
  #kills { font-size: 14px; white-space: nowrap; }
  #buffs { font-size: 14px; white-space: nowrap; color: #9ad1ff; }
  /* 보스 바 */
  #bossBar { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 50%; transform: translateX(-50%); width: min(420px, calc(100vw - 24px)); display: none; z-index: 11; }
  #bossName { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
  #bossBar .bar { height: 20px; }
  #bossFill { background: linear-gradient(90deg, #9d0208, #e63946); width: 100%; }
  /* 스킬 아이콘 */
  #skills { position: fixed; bottom: calc(34px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .skill-icon { width: 48px; height: 48px; background: #1a1a2e; border: 2px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
  .evolve-btn { background: linear-gradient(135deg, #8e54e9, #ff5e78); border: none; color: #fff; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 8px; cursor: pointer; margin-right: 8px; }
  .evolve-btn.hidden { display: none; }
  .skill-cd { position: absolute; inset: 0; background: rgba(0,0,0,0.7); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
  .skill-dmg { position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); font-size: 9px; font-weight: 700; color: #9ad1ff; text-shadow: 0 1px 2px #000; white-space: nowrap; pointer-events: none; }
  /* 동료 칩 */
  #compChip { position: fixed; right: 12px; bottom: 64px; z-index: 5; display: none;
    background: rgba(10,12,20,0.75); border: 1px solid #3a3f55; border-radius: 8px;
    padding: 4px 10px; font-size: 13px; color: #ddd; }
  /* 동료 선택 카드 */
  #compCards { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .comp-card { flex: 1; text-align: center; padding: 10px 6px; border: 2px solid #333;
    border-radius: 10px; cursor: pointer; background: rgba(0,0,0,0.3); transition: all .15s; }
  .comp-card:hover { border-color: #666; }
  .comp-card.selected { border-color: #ffd166; background: rgba(255,209,102,0.12);
    box-shadow: 0 0 12px rgba(255,209,102,0.35); }
  .comp-icon { font-size: 26px; }
  .comp-name { font-weight: 700; margin: 4px 0 2px; font-size: 14px; }
  .comp-desc { font-size: 11px; color: #999; line-height: 1.4; }
  /* 모달 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden { display: none; }
  .modal { background: linear-gradient(180deg, #1a1a2e, #0a0a1a); border: 2px solid #ffd166; border-radius: 16px; padding: 30px; max-width: 600px; width: 90%; text-align: center; }
  .modal h2 { color: #ffd166; margin-bottom: 15px; font-size: 1.5em; }
  .modal p { margin-bottom: 10px; color: #ccc; }
  .skill-choices { display: flex; gap: 12px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
  .skill-choice { background: #1a1a2e; border: 2px solid #444; border-radius: 12px; padding: 15px; width: 170px; cursor: pointer; transition: all 0.2s; }
  .skill-choice:hover { border-color: #ffd166; transform: translateY(-4px); box-shadow: 0 4px 15px rgba(255,209,102,0.3); }
  .skill-choice .name { font-weight: bold; color: #ffd166; margin-bottom: 6px; }
  .skill-choice .desc { font-size: 12px; color: #aaa; }
  .btn { padding: 12px 30px; font-size: 1.1em; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: linear-gradient(180deg, #ffd166, #e6a800); color: #1a0a2e; }
  .btn:hover { transform: translateY(-2px); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
  .stat { background: #111; padding: 8px; border-radius: 6px; }
  .stat span { color: #ffd166; }
  /* 모바일: HUD 2줄 레이아웃 + 세이프 영역 */
  @media (max-width: 640px) {
    .hud { padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; flex-wrap: wrap; gap: 10px; row-gap: 6px; }
    .bar-wrap { flex: 1 1 calc(50% - 8px); max-width: none; }
    .bar-label { font-size: 10px; }
    .bar { height: 14px; }
    .bar-text { font-size: 10px; }
    #stageInfo, #timer, #kills, #buffs { font-size: 12px; flex: 1 1 0; text-align: center; white-space: nowrap; }
    #bossBar { top: calc(env(safe-area-inset-top) + 72px); }
    #skills { left: auto; right: 8px; bottom: auto; top: 50%; transform: translateY(-50%); flex-direction: column; gap: 8px; max-height: 72vh; overflow-y: auto; }
    .skill-icon { width: 44px; height: 44px; font-size: 18px; }
    .skill-dmg { bottom: auto; right: calc(100% + 6px); top: 50%; transform: translateY(-50%); }
    #compChip { right: auto; left: 10px; bottom: auto; top: 78px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div class="hud" id="hud" style="display:none">
  <div class="bar-wrap">
    <div class="bar-label">HP</div>
    <div class="bar"><div class="bar-fill" id="hpFill"></div><div class="bar-text" id="hpText"></div></div>
  </div>
  <div class="bar-wrap">
    <div class="bar-label">XP (Lv <span id="lvlText">1</span>)</div>
    <div class="bar"><div class="bar-fill" id="xpFill"></div><div class="bar-text" id="xpText"></div></div>
  </div>
  <div id="stageInfo">Stage 1</div>
  <div id="timer">2:00</div>
  <div id="kills">0/40</div>
  <div id="buffs"></div>
</div>

<!-- 보스 바 -->
<div id="bossBar">
  <div id="bossName">BOSS</div>
  <div class="bar"><div class="bar-fill" id="bossFill"></div><div class="bar-text" id="bossHpText"></div></div>
</div>

<!-- 스킬 아이콘 -->
<div id="skills"><button id="evolveBtn" class="evolve-btn hidden">⚗️ 진화</button></div>

<!-- 동료 칩 -->
<div id="compChip"></div>

<!-- 시작 화면 -->
<div class="modal-overlay" id="startModal">
  <div class="modal">
    <img src="assets/title_art.png" style="width:100%;border-radius:10px;margin-bottom:14px" onerror="this.style.display='none'">
    <h2>⚔️ Survival Roguelike</h2>
    <p>WASD 이동 — 근접 자동공격 — 3택1 스킬 성장</p>
    <p style="font-size:12px;color:#888">R: 재시작</p>
    <br>
    <p style="margin:8px 0 6px;font-size:13px;color:#aaa">— 동료를 선택하세요 —</p>
    <div id="compCards"></div>
    <button class="btn" id="startBtn">게임 시작</button>
  </div>
</div>

<!-- 레벨업 모달 -->
<div class="modal-overlay hidden" id="levelupModal">
  <div class="modal">
    <h2>🎉 Level Up!</h2>
    <p>스킬을 선택하세요</p>
    <div class="skill-choices" id="skillChoices"></div>
  </div>
</div>

<!-- 스킬 진화 모달 -->
<div class="modal-overlay hidden" id="evolveModal">
  <div class="modal">
    <h2>⚗️ 스킬 진화</h2>
    <p style="margin: 8px 0 14px; color: #aaa; font-size: 13px;">Lv5 공격 스킬 두 개가 결합해 하나의 강력한 스킬로 진화합니다.</p>
    <div class="skill-choices" id="evolveChoices"></div>
    <button class="menu-btn" id="evolveBackBtn" style="margin-top: 14px;">돌아가기</button>
  </div>
</div>

<!-- 게임오버 모달 -->
<div class="modal-overlay hidden" id="gameoverModal">
  <div class="modal">
    <h2>💀 Game Over</h2>
    <div class="stats" id="goStats"></div>
    <button class="btn" id="restartBtn">다시 시작</button>
  </div>
</div>

<!-- 승리 모달 -->
<div class="modal-overlay hidden" id="winModal">
  <div class="modal">
    <h2>🏆 Victory!</h2>
    <div class="stats" id="winStats"></div>
    <button class="btn" id="winRestartBtn">다시 시작</button>
  </div>
</div>

<script src="game-logic.js"></script>
<script>
// ===== IIFE: 게임 클라이언트 =====
(function() {
  // ===== 상수 =====
  const PLAYER = {
    speed: 220, hp: 120, maxHp: 120,
    atkDmg: 18, atkCd: 0.5, atkRange: 55,
    xpRadius: 60, invuln: 0.3, radius: 14,
  };
  const WORLD = { w: 2400, h: 1800 };
  const ENEMY_COLORS = { basic: '#e63946', fast: '#7ae582', tanky: '#b197fc', ranged: '#4dabf7', miniboss: '#4ade80', boss: '#ff2e63' };
  const MAX_ENEMIES = 60;

  // ===== Canvas =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  addEventListener('resize', resize);

  // ===== 에셋 로더 =====
  const ASSET_NAMES = ['player','enemy_basic','enemy_fast','enemy_tanky','enemy_ranged','enemy_miniboss','enemy_boss','xp_orb','icon_fireball','icon_chainlightning','icon_shield','icon_multishot','icon_lifesteal','icon_slowfield','icon_split','icon_spinblade','icon_explosion','icon_speed','icon_iceshard','icon_tidal','icon_poison','icon_evo_chainlightning_fireball','icon_evo_fireball_poison','icon_evo_iceshard_poison','icon_evo_chainlightning_iceshard','icon_evo_chainlightning_poison','icon_evo_fireball_spinblade','icon_evo_chainlightning_spinblade','icon_evo_explosion_spinblade','icon_evo_iceshard_spinblade','icon_evo_spinblade_tidal','icon_evo_poison_spinblade','icon_evo_explosion_fireball','icon_evo_fireball_iceshard','icon_evo_chainlightning_explosion','icon_evo_explosion_iceshard','icon_evo_explosion_tidal','icon_evo_explosion_poison','icon_evo_fireball_tidal','icon_evo_chainlightning_tidal','icon_evo_iceshard_tidal','icon_evo_poison_tidal','bg_tile','title_art'];
  const ASSETS = {};
  let bgPattern = null;
  ASSET_NAMES.forEach((name) => {
    const img = new Image();
    img.onload = () => { ASSETS[name] = img; };
    img.src = 'assets/' + name + '.png';
  });
  function drawAsset(name, x, y, size) {
    const a = ASSETS[name];
    if (!a) return false;
    ctx.drawImage(a, x - size / 2, y - size / 2, size, size);
    return true;
  }

  // ===== 프레임 애니메이션 (3프레임 시트) =====
  // 1 캐릭터당 3프레임. 3개 전부 로드 성공 시에만 활성화, 그 외 정적 에셋 폴백
  const ANIM_SPECS = {
    player: { fps: 9 },
    enemy_basic: { fps: 8 },
    enemy_fast: { fps: 12 },
    enemy_tanky: { fps: 5 },
    enemy_ranged: { fps: 7 },
    enemy_miniboss: { fps: 6 },
    enemy_boss: { fps: 6, seq: [0, 1, 2, 1] }, // 날개짓: 순환(팔린드롬) 시퀀스
    comp_warrior: { fps: 6 },
    comp_guardian: { fps: 5 },
    comp_shadow: { fps: 8 },
  };
  const ANIM = {};
  for (const an in ANIM_SPECS) {
    const frames = [];
    let loaded = 0;
    for (let i = 0; i < 3; i++) {
      const img = new Image();
      img.onload = () => { loaded++; frames[i] = img; if (loaded === 3) ANIM[an] = frames; };
      img.src = 'assets/' + an + '_f' + i + '.png';
    }
  }
  function drawSprite(name, x, y, size, animT, moving, phase) {
    const frames = ANIM[name];
    if (frames) {
      const spec = ANIM_SPECS[name];
      const t = (animT || 0) * spec.fps;
      const idx = spec.seq ? spec.seq[Math.floor(t) % spec.seq.length] : Math.floor(t) % frames.length;
      const bob = Math.sin(t * Math.PI + (phase || 0)) * size * (moving ? 0.035 : 0.012);
      ctx.drawImage(frames[idx], x - size / 2, y - size / 2 - bob, size, size);
      return true;
    }
    return drawAsset(name, x, y, size);
  }
  function iconHtml(id) {
    return ASSETS['icon_' + id]
      ? '<img src="assets/icon_' + id + '.png" style="width:24px;height:24px;vertical-align:middle;margin-right:5px;border-radius:6px">'
      : SKILL_ICONS[id] + ' ';
  }

  // ===== 게임 상태 =====
  let G = null;
  const cam = { x: 0, y: 0 };
  const keys = {};
  let currentChoices = [];

  function newRun() {
    const g = {
      state: 'menu', time: 0, stage: 1,
      player: {
        x: WORLD.w/2, y: WORLD.h/2, radius: 14,
        hp: PLAYER.hp, maxHp: PLAYER.maxHp,
        shield: 0, shieldDur: 0,
        xp: 0, level: 1, dmgBonus: 0,
        skills: { shield: 1 }, atkTimer: 0, invulnTimer: 0, skillTimers: {},
        facing: { x: 1, y: 0 }, flash: 0, trail: [], animT: 0, moving: false,
      },
      enemies: [], projectiles: [], pickups: [], particles: [], slashes: [], floaters: [],
      items: [],
      lightnings: [], explosions: [], slowfieldFx: [], bossWarnings: [], waves: [],
      tempBuffs: { rage: 0, haste: 0, magnet: 0 },
      skillDamage: {},
      levelupQueue: 0, banner: '', bannerT: 0, bossSpawned: false,
      kills: 0, totalKills: 0,
      spawnTimer: 0, boss: null, stageTime: 0, shake: 0,
    };
    // ===== 동료 초기화 =====
    g.companion = {
      id: (CONFIG.COMPANIONS.find(c => c.id === chosenCompId) || CONFIG.COMPANIONS[0]).id,
      x: g.player.x - 45, y: g.player.y,
      atkTimer: 1, healTimer: 8, ultTimer: 10,
    };
    g.knives = [];
    const _gdef = CONFIG.COMPANIONS.find(c => c.id === g.companion.id);
    if (_gdef.passive.maxHp) { g.player.maxHp += _gdef.passive.maxHp; g.player.hp = g.player.maxHp; }
    return g;
  }

  // ===== 저장소 =====
  const Save = {
    key: 'survival_roguelike_best',
    load() { try { return JSON.parse(localStorage.getItem(this.key)) || null; } catch { return null; } },
    save(rec) { try { localStorage.setItem(this.key, JSON.stringify(rec)); } catch {} },
  };

  // ===== 유틸 =====
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; }
  function nearestEnemy(x, y, range) {
    return G.enemies.filter(e => e.hp > 0 && dist2(e, {x,y}) < range*range)
      .sort((a,b) => dist2(a,{x,y}) - dist2(b,{x,y}))[0];
  }

  // ===== 스폰 =====
  function spawnEnemy(forceType) {
    const stage = G.stage;
    const type = forceType || rollEnemyType(stage, Math.random);
    const base = CONFIG.ENEMIES[type];
    const scale = enemyHpScale(stage);
    const angle = Math.random() * Math.PI * 2;
    const dist = 500 + Math.random() * 300;
    const e = {
      type, x: clamp(G.player.x + Math.cos(angle)*dist, 50, WORLD.w-50),
      y: clamp(G.player.y + Math.sin(angle)*dist, 50, WORLD.h-50),
      hp: Math.round(base.hp * scale), maxHp: Math.round(base.hp * scale),
      speed: base.speed, dmg: Math.round(base.dmg * enemyDmgScale(stage)),
      xp: base.xp, radius: type === 'tanky' ? 20 : type === 'miniboss' ? 30 : 13,
      slow: 0, stun: 0, hitFlash: 0,
      shootTimer: (type === 'ranged' || type === 'miniboss' || type === 'boss') ? 1 : 0,
      animT: Math.random() * 2, phase: Math.random() * 6.28,
    };
    return e;
  }

  function spawnBoss(stage) {
    const bt = CONFIG.STAGES[stage - 1].bossType; // 'miniboss' | 'boss'
    const base = CONFIG.ENEMIES[bt];
    const angle = Math.random() * Math.PI * 2;
    const e = {
      type: bt,
      x: G.player.x + Math.cos(angle)*600, y: G.player.y + Math.sin(angle)*600,
      hp: base.hp * enemyHpScale(stage), maxHp: base.hp * enemyHpScale(stage),
      speed: base.speed, dmg: base.dmg * enemyDmgScale(stage),
      xp: base.xp, radius: bt === 'miniboss' ? 30 : 44,
      slow: 0, stun: 0, hitFlash: 0, shootTimer: 2,
      animT: 0, phase: Math.random() * 6.28,
    };
    G.boss = e;
    G.enemies.push(e);
  }

  // ===== 데미지 =====
  // power 패시브: 전체 데미지 배율 (근접 + 스킬 직접 피해) + 광전사 패시브
  function dmgMul() {
    let m = 1;
    if (G && G.player) {
      m += G.player.dmgBonus || 0;
      if (G.player.skills.power) {
        const s = skillStats('power', G.player.skills.power);
        if (s) m += s.pct / 100;
      }
    }
    if (G && G.companion) {
      const cd = CONFIG.COMPANIONS.find(c => c.id === G.companion.id);
      if (cd && cd.passive.dmgPct) m += cd.passive.dmgPct / 100;
    }
    if (G && G.tempBuffs && G.tempBuffs.rage > 0) m *= 2;
    return m;
  }
  // 그림자 패시브: 근접 공격속도 증가율
  function compAtkSpd() {
    if (!G || !G.companion) return 0;
    const cd = CONFIG.COMPANIONS.find(c => c.id === G.companion.id);
    return cd && cd.passive.atkSpdPct ? cd.passive.atkSpdPct / 100 : 0;
  }
  function damageEnemy(e, dmg, opts = {}) {
    e.hp -= dmg;
    if (opts.skillId) G.skillDamage[opts.skillId] = (G.skillDamage[opts.skillId] || 0) + dmg;
    e.hitFlash = 0.1;
    if (opts.stun) e.stun = Math.max(e.stun, opts.stun);
    // 데미지 숫자
    if (dmg >= 1) {
      G.floaters.push({ x: e.x + (Math.random()-.5)*16, y: e.y - e.radius - 8, txt: Math.round(dmg), color: opts.fromMelee ? '#ffffff' : '#ffd166', t: 0.7, maxT: 0.7 });
      if (G.floaters.length > 60) G.floaters.shift();
    }
    // 흡혈
    const ls = G.player.skills.lifesteal;
    if (ls && opts.fromMelee) {
      const st = skillStats('lifesteal', ls);
      G.player.hp = Math.min(G.player.maxHp, G.player.hp + Math.round(dmg * st.pct / 100));
    }
    if (e.hp <= 0) {
      // 처치 이펙트
      for (let i = 0; i < (e.type === 'boss' ? 40 : 8); i++) {
        G.particles.push({
          x: e.x, y: e.y, vx: (Math.random()-.5)*200, vy: (Math.random()-.5)*200,
          life: .5, maxLife: .5, color: e.type === 'boss' ? '#ffd166' : '#e63946', size: 3,
        });
      }
      if (e.type === 'boss' || e.type === 'miniboss') G.boss = null; // S5: 미니보스 사후에도 참조 해제 (진행 막힘 방지)
      G.kills++; G.totalKills++;
      const lsK = G.player.skills.lifesteal;
      if (lsK) { const stK = skillStats('lifesteal', lsK); if (stK && stK.killHeal) G.player.hp = Math.min(G.player.maxHp, G.player.hp + stK.killHeal); }
      const crit = Math.random() < (e.type === 'miniboss' ? 0.50 : 0.10); // 미니보스: 50% / 일반: 10% → 5배 XP 구슬
      const xpVal = crit ? e.xp * 5 : e.xp;
      G.pickups.push({ x: e.x, y: e.y, xp: xpVal, r: xpVal >= 20 ? 10 : 5, t: 0, crit });
      // ===== 아이템 드롭 =====
      if (e.type === 'boss' || e.type === 'miniboss') {
        const n = e.type === 'boss' ? 3 : 1;
        const seen = new Set();
        for (let i = 0; i < n; i++) {
          let id, tries = 0;
          do { id = rollItem(); tries++; } while (e.type === 'boss' && seen.has(id) && tries < 6);
          seen.add(id);
          G.items.push({ id, x: e.x + (Math.random() - 0.5) * 50, y: e.y + (Math.random() - 0.5) * 50, t: 0 });
        }
      } else {
        for (const id in CONFIG.ITEMS) {
          if (Math.random() < itemDropChance(id)) {
            G.items.push({ id, x: e.x + (Math.random() - 0.5) * 30, y: e.y + (Math.random() - 0.5) * 30, t: 0 });
          }
        }
      }
      G.shake = Math.min(1, G.shake + (e.type === 'boss' ? 0.5 : 0.1));
    }
  }

  // ===== 플레이어 업데이트 =====
  function updatePlayer(dt) {
    const p = G.player;
    let dx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    let dy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
    p.moving = !!(dx || dy);
    p.animT = p.moving ? p.animT + dt : 0;
    if (dx || dy) {
      const len = Math.hypot(dx, dy); dx /= len; dy /= len;
      p.facing = { x: dx, y: dy };
      const spd = PLAYER.speed * (1 + (p.skills.speed ? skillStats('speed', p.skills.speed).pct : 0) / 100) * (G.tempBuffs.haste > 0 ? 1.5 : 1);
      p.x = clamp(p.x + dx * spd * dt, PLAYER.radius, WORLD.w - PLAYER.radius);
      p.y = clamp(p.y + dy * spd * dt, PLAYER.radius, WORLD.h - PLAYER.radius);
    }
    // 이동 트레일
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 8) p.trail.shift();
    p.atkTimer -= dt;
    p.invulnTimer -= dt;
    p.flash = Math.max(0, p.flash - dt);
    if (p.shield > 0) { p.shieldDur -= dt; if (p.shieldDur <= 0) p.shield = 0; }

    // 근접 자동공격
    if (p.atkTimer <= 0) {
      const hits = p.skills.multishot ? skillStats('multishot', p.skills.multishot).hits : 1;
      const range = PLAYER.atkRange + (p.skills.multishot && p.skills.multishot >= 3 ? 10 : 0) + p.radius;
      const targets = G.enemies.filter(e => e.hp > 0 && dist2(e, p) < range * range)
        .sort((a, b) => dist2(a, p) - dist2(b, p)).slice(0, 1);
      if (targets.length) {
        const cdMul = p.skills.multishot ? (p.skills.multishot >= 4 ? 0.9 : 1) * (p.skills.multishot >= 5 ? 0.9 : 1) : 1;
        p.atkTimer = PLAYER.atkCd * cdMul / hits * (1 - compAtkSpd());
        for (const t of targets) {
          for (let i = 0; i < hits; i++) damageEnemy(t, PLAYER.atkDmg * (i === 0 ? 1 : 0.5) * dmgMul(), { fromMelee: true });
          G.particles.push({ x: t.x, y: t.y, vx: (Math.random()-.5)*80, vy: (Math.random()-.5)*80, life: .12, maxLife: .12, color: '#fff', size: 4 });
        }
        // 슬래시 이펙트
        const a = Math.atan2(targets[0].y - p.y, targets[0].x - p.x);
        G.slashes.push({ x: p.x, y: p.y, angle: a, range, t: 0.16, maxT: 0.16 });
      }
    }
  }

  // ===== 동료 시스템 =====
  const COMP_COLORS = { warrior: '#ff9f43', guardian: '#4dabf7', shadow: '#b197fc' };
  function updateCompanion(dt) {
    const c = G.companion;
    if (!c) return;
    const p = G.player;
    const def = CONFIG.COMPANIONS.find(x => x.id === c.id);
    if (!def) return;
    // 추종: 플레이어와 40px 간격 유지
    const dx = p.x - c.x, dy = p.y - c.y;
    const d = Math.hypot(dx, dy) || 1;
    if (d > 40) {
      const sp = Math.min(280, d * 6) * dt;
      c.x += dx / d * sp; c.y += dy / d * sp;
    }
    c.atkTimer -= dt; c.ultTimer -= dt;
    if (c.id === 'warrior') {
      if (c.atkTimer <= 0) {
        const t = nearestEnemy(c.x, c.y, def.atk.range);
        if (t) {
          c.atkTimer = def.atk.cd;
          G.slashes.push({ x: c.x, y: c.y, angle: Math.atan2(t.y - c.y, t.x - c.x), range: 44, t: 0.16, maxT: 0.16 });
          damageEnemy(t, def.atk.dmg);
        }
      }
      if (c.ultTimer <= 0) {
        const near = G.enemies.filter(e => e.hp > 0 && dist2(e, p) < def.ult.radius * def.ult.radius);
        if (near.length) {
          c.ultTimer = def.ult.cd;
          G.explosions.push({ x: p.x, y: p.y, r: def.ult.radius, t: 0.4, maxT: 0.4 });
          for (const e of near) damageEnemy(e, def.ult.dmg);
          G.floaters.push({ x: p.x, y: p.y - 26, txt: def.ult.label, color: '#ff9f43', t: 0.8, maxT: 0.8 });
        }
      }
    } else if (c.id === 'guardian') {
      c.healTimer -= dt;
      if (c.healTimer <= 0 && p.hp < p.maxHp) {
        c.healTimer = def.heal.cd;
        p.hp = Math.min(p.maxHp, p.hp + def.heal.amount);
        G.floaters.push({ x: p.x, y: p.y - 24, txt: '+' + def.heal.amount, color: '#7ae582', t: 0.8, maxT: 0.8 });
      }
      if (c.ultTimer <= 0) {
        c.ultTimer = def.ult.cd;
        p.shield = Math.max(p.shield, def.ult.shield);
        // 파티클: 기존 G.particles.push 형식 모사 — 파란 링
        G.particles.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: .4, maxLife: .4, color: '#4dabf7', size: p.radius + 8, ring: true });
        G.floaters.push({ x: p.x, y: p.y - 24, txt: def.ult.label + ' +' + def.ult.shield, color: '#4dabf7', t: 0.8, maxT: 0.8 });
      }
    } else if (c.id === 'shadow') {
      if (c.atkTimer <= 0) {
        const t = nearestEnemy(c.x, c.y, def.atk.range);
        if (t) {
          c.atkTimer = def.atk.cd;
          const a = Math.atan2(t.y - c.y, t.x - c.x);
          G.knives.push({ x: c.x, y: c.y, vx: Math.cos(a) * def.atk.projSpeed, vy: Math.sin(a) * def.atk.projSpeed, dmg: def.atk.dmg, life: 1.2 });
        }
      }
      if (c.ultTimer <= 0) {
        const t = nearestEnemy(c.x, c.y, def.ult.range);
        if (t) {
          c.ultTimer = def.ult.cd;
          for (let i = 0; i < def.ult.hits; i++) {
            const a = Math.atan2(t.y - c.y, t.x - c.x) + (i - 1) * 0.35;
            G.slashes.push({ x: c.x, y: c.y, angle: a, range: 48, t: 0.16, maxT: 0.16 });
            damageEnemy(t, def.ult.dmg);
          }
          G.floaters.push({ x: p.x, y: p.y - 26, txt: def.ult.label, color: '#b197fc', t: 0.8, maxT: 0.8 });
        }
      }
    }
    // 칼날 투사체
    for (const k of G.knives) {
      k.x += k.vx * dt; k.y += k.vy * dt; k.life -= dt;
      for (const e of G.enemies) {
        if (e.hp > 0 && dist2(e, k) < (e.radius + 5) * (e.radius + 5)) { damageEnemy(e, k.dmg); k.life = 0; break; }
      }
    }
    G.knives = G.knives.filter(k => k.life > 0);
  }

  // ===== 적 업데이트 (AI 4종 + 보스) =====
  function updateEnemies(dt) {
    const p = G.player;
    for (const e of G.enemies) {
      if (e.hp <= 0) continue;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      // 연소
      if (e.burn > 0) {
        e.burn -= dt;
        damageEnemy(e, e.burnDps * dt);
        if (e.hp <= 0) continue;
      }
      // 독 (poison)
      if (e.poisonDur > 0) {
        e.poisonDur -= dt;
        if (e.poisonDur > 0) damageEnemy(e, e.poisonDps * dt, { skillId: 'poison' });
        if (e.hp <= 0) continue;
      }
      // 스톤
      if (e.stun > 0) { e.stun -= dt; continue; }
      e.animT = (e.animT || 0) + dt;
      // 감속
      let mul = 1;
      if (e.slowDur > 0) { e.slowDur -= dt; mul = 1 - e.slow / 100; if (e.slowDur <= 0) e.slow = 0; }
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      let mx = 0, my = 0;
      const spd = e.speed * mul;
      switch (e.type) {
        case 'basic': mx = nx; my = ny; break;
        case 'fast': {
          const wob = Math.sin(G.time * 4 + e.x * 0.01 + e.y * 0.01) * 0.5;
          mx = nx + -ny * wob; my = ny + nx * wob;
          const l = Math.hypot(mx, my) || 1; mx /= l; my /= l;
          break;
        }
        case 'tanky': mx = nx; my = ny; break;
        case 'ranged':
          if (d < 150) { mx = -nx; my = -ny; }
          else if (d > 250) { mx = nx; my = ny; }
          else { mx = -ny * 0.6; my = nx * 0.6; }
          e.shootTimer -= dt;
          if (e.shootTimer <= 0 && d < 400) {
            e.shootTimer = 1.5;
            G.projectiles.push({ x: e.x, y: e.y, vx: nx * 260, vy: ny * 260, dmg: e.dmg, friendly: false, r: 5, life: 3 });
          }
          break;
        case 'miniboss':
          mx = nx; my = ny;
          e.shootTimer -= dt;
          if (e.shootTimer <= 0) {
            e.shootTimer = 2;
            for (let i = 0; i < 8; i++) {
              const a = (i / 8) * Math.PI * 2 + G.time;
              G.projectiles.push({ x: e.x, y: e.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, dmg: e.dmg, friendly: false, r: 6, life: 4 });
            }
          }
          break;
        case 'boss':
          mx = nx; my = ny;
          e.shootTimer -= dt;
          if (e.shootTimer <= 0) {
            e.shootTimer = 2;
            for (let i = 0; i < 8; i++) {
              const a = (i / 8) * Math.PI * 2 + G.time * 0.7;
              G.projectiles.push({ x: e.x, y: e.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, dmg: e.dmg * 0.6, friendly: false, r: 6, life: 4 });
            }
          }
          if (e.slashTimer === undefined) e.slashTimer = 3;
          e.slashTimer -= dt;
          if (e.slashTimer <= 0) {
            e.slashTimer = 3;
            G.bossWarnings.push({ x: p.x, y: p.y, r: 120, t: 0.5, maxT: 0.5, dmg: e.dmg });
          }
          break;
      }
      e.x = clamp(e.x + mx * spd * dt, 20, WORLD.w - 20);
      e.y = clamp(e.y + my * spd * dt, 20, WORLD.h - 20);
      // 충돌 데미지
      const rr = e.radius + p.radius;
      if (d < rr && p.invulnTimer <= 0) {
        p.invulnTimer = PLAYER.invuln;
        p.flash = 0.2;
        let dmg = e.dmg;
        if (p.shield > 0) {
          const sh = p.skills.shield ? skillStats('shield', p.skills.shield) : null;
          if (sh && sh.dmgReduce) dmg *= (1 - sh.dmgReduce / 100);
          p.shield = Math.max(0, p.shield - dmg);
          if (p.shield === 0) p.shieldDur = 0;
        } else p.hp -= dmg;
        G.shake = Math.min(1, G.shake + 0.2);
        for (let i = 0; i < 6; i++) G.particles.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 150, vy: (Math.random() - .5) * 150, life: .3, maxLife: .3, color: '#e63946', size: 3 });
      }
    }
    G.enemies = G.enemies.filter(e => e.hp > 0);
  }

  // ===== 투사체 업데이트 =====
  function updateProjectiles(dt) {
    const p = G.player;
    for (const pr of G.projectiles) {
      pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
      if (pr.life <= 0) { pr.dead = true; continue; }
      if (pr.x < 0 || pr.x > WORLD.w || pr.y < 0 || pr.y > WORLD.h) { pr.dead = true; continue; }
      if (pr.friendly) {
        for (const e of G.enemies) {
          if (e.hp <= 0 || (pr.hitSet && pr.hitSet.has(e))) continue;
          const rr = e.radius + pr.r;
          if (dist2(e, pr) < rr * rr) {
            damageEnemy(e, pr.dmg * dmgMul(), pr.skillId ? { skillId: pr.skillId } : {});
            if (pr.burn && e.hp > 0) { e.burn = pr.burn; e.burnDps = pr.burnDps; }
            if (pr.slow && e.hp > 0) { e.slow = Math.max(e.slow, pr.slow); e.slowDur = Math.max(e.slowDur || 0, pr.slowDur); }
            if (pr.poisonDps && e.hp > 0) { e.poisonDps = Math.max(e.poisonDps || 0, pr.poisonDps); e.poisonDur = Math.max(e.poisonDur || 0, 3); }
            const sp = p.skills.split ? skillStats('split', p.skills.split) : null;
            if (sp && !pr.noSplit) {
              const base = Math.atan2(pr.vy, pr.vx);
              for (let i = 0; i < sp.count; i++) {
                const a = base + (i - (sp.count - 1) / 2) * 0.5;
                G.projectiles.push({ x: pr.x, y: pr.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, dmg: pr.dmg * 0.5, friendly: true, r: 4, life: 1, noSplit: true });
              }
            }
            if (pr.pierce > 0) { pr.pierce--; if (!pr.hitSet) pr.hitSet = new Set(); pr.hitSet.add(e); }
            else { pr.dead = true; }
            if (pr.dead) break;
          }
        }
      } else {
        const rr = p.radius + pr.r;
        if (dist2(p, pr) < rr * rr && p.invulnTimer <= 0) {
          pr.dead = true;
          p.invulnTimer = PLAYER.invuln; p.flash = 0.2;
          let dmg = pr.dmg;
          if (p.shield > 0) {
            const sh = p.skills.shield ? skillStats('shield', p.skills.shield) : null;
            if (sh && sh.dmgReduce) dmg *= (1 - sh.dmgReduce / 100);
            p.shield = Math.max(0, p.shield - dmg);
          } else p.hp -= dmg;
          G.shake = Math.min(1, G.shake + 0.15);
        }
      }
    }
    G.projectiles = G.projectiles.filter(pr => !pr.dead);
  }

  // ===== 링 웨이브 (tidal / 진화 해일류) =====
  function updateWaves(dt) {
    for (const w of G.waves) {
      w.r += w.speed * dt;
      for (const e of G.enemies) {
        if (e.hp <= 0 || w.hit.has(e)) continue;
        const d = Math.hypot(e.x - w.x, e.y - w.y);
        if (d < w.r && d > w.r - 60) {
          w.hit.add(e);
          damageEnemy(e, w.dmg * dmgMul(), { skillId: w.skillId });
          if (e.hp > 0 && w.kb) {
            const dd = Math.max(1, d), ux = (e.x - w.x) / dd, uy = (e.y - w.y) / dd;
            e.x = Math.min(WORLD.w, Math.max(0, e.x + ux * w.kb));
            e.y = Math.min(WORLD.h, Math.max(0, e.y + uy * w.kb));
          }
          if (w.effect) applyStatus(e, w.effect, w.tier, w.skillId);
        }
      }
    }
    G.waves = G.waves.filter(w => w.r < w.maxR);
  }

  // ===== 진화 스킬 상태 적용 (burn/slow/stun/poison/kb) =====
  function applyStatus(e, effect, st, skillId) {
    if (!effect || e.hp <= 0) return;
    if (effect === 'burn') { e.burn = st.burn || 3; e.burnDps = st.burnDps || 8; }
    else if (effect === 'slow') { e.slow = Math.max(e.slow, st.slow); e.slowDur = Math.max(e.slowDur || 0, st.slowDur); }
    else if (effect === 'stun') { if (Math.random() * 100 < (st.stunChance || 0)) e.stun = Math.max(e.stun, st.stun || 1); }
    else if (effect === 'poison') { e.poisonDps = Math.max(e.poisonDps || 0, st.poisonDps); e.poisonDur = Math.max(e.poisonDur || 0, st.poisonDur || 3); }
    else if (effect === 'kb') {
      const dd = Math.max(1, Math.hypot(e.x - G.player.x, e.y - G.player.y)), ux = (e.x - G.player.x) / dd, uy = (e.y - G.player.y) / dd;
      e.x = Math.min(WORLD.w, Math.max(0, e.x + ux * (st.kb || 0)));
      e.y = Math.min(WORLD.h, Math.max(0, e.y + uy * (st.kb || 0)));
    }
  }

  // ===== 스킬 업데이트 (자동 발동) =====
  function updateSkills(dt) {
    const p = G.player;
    for (const id in p.skills) {
      const lv = p.skills[id];
      const st = skillStats(id, lv);
      if (!st) continue;
      p.skillTimers[id] = (p.skillTimers[id] === undefined ? 0 : p.skillTimers[id]) - dt;
      let t = p.skillTimers[id];
      const evo = CONFIG.EVOLUTIONS[id];
      if (evo) {
        if (evo.form === 'spin') {
          p.evoSpinAcc = p.evoSpinAcc || {};
          p.evoSpinAcc[id] = (p.evoSpinAcc[id] || 0) + dt;
          if (p.evoSpinAcc[id] >= (st.tick || 0.4)) {
            p.evoSpinAcc[id] = 0;
            for (const e of G.enemies) {
              if (e.hp <= 0) continue;
              if (dist2(e, p) <= st.radius * st.radius) {
                damageEnemy(e, st.dps * (st.tick || 0.4) * dmgMul(), { skillId: id });
                if (e.hp <= 0) continue;
                if (evo.effect === 'kb') {
                  const dd = Math.max(1, Math.sqrt(dist2(e, p))), ux = (e.x - p.x) / dd, uy = (e.y - p.y) / dd;
                  e.x = Math.min(WORLD.w, Math.max(0, e.x + ux * st.kb));
                  e.y = Math.min(WORLD.h, Math.max(0, e.y + uy * st.kb));
                } else applyStatus(e, evo.effect, st, id);
              }
            }
          }
        } else if (t <= 0) {
          const e0 = nearestEnemy(p.x, p.y, 450);
          if (e0) {
            t = st.cd;
            if (evo.form === 'aoe') {
              G.explosions.push({ x: e0.x, y: e0.y, r: st.radius, t: 0.4, maxT: 0.4 });
              for (const e of G.enemies) {
                if (e.hp > 0 && dist2(e, e0) < st.radius * st.radius) {
                  damageEnemy(e, st.dmg * dmgMul(), { skillId: id });
                  if (e.hp > 0) applyStatus(e, evo.effect, st, id);
                }
              }
              G.shake = Math.min(1, G.shake + 0.3);
            } else if (evo.form === 'wave') {
              G.waves.push({ x: p.x, y: p.y, r: 40, maxR: st.maxR, speed: 320, dmg: st.dmg, kb: st.kb || 0, effect: evo.effect, tier: st, skillId: id, hit: new Set() });
            } else if (evo.form === 'chain') {
              const hitList = [e0];
              let cur = e0;
              for (let i = 1; i < st.chains; i++) {
                const next = G.enemies.filter(e => e.hp > 0 && !hitList.includes(e))
                  .sort((a, b) => dist2(a, cur) - dist2(b, cur))[0];
                if (!next) break;
                hitList.push(next); cur = next;
              }
              G.lightnings.push({ pts: [{ x: p.x, y: p.y }].concat(hitList.map(e => ({ x: e.x, y: e.y }))), t: 0.15, maxT: 0.15 });
              for (const e of hitList) {
                damageEnemy(e, st.dmg * dmgMul(), { skillId: id });
                if (e.hp > 0) applyStatus(e, evo.effect, st, id);
              }
            } else {
              const a = Math.atan2(e0.y - p.y, e0.x - p.x);
              G.projectiles.push({ x: p.x, y: p.y, vx: Math.cos(a) * 480, vy: Math.sin(a) * 480, dmg: st.dmg, friendly: true, r: 8, life: 1.5, pierce: st.pierce || 0, burn: st.burn || 0, burnDps: st.burnDps || 0, poisonDps: st.poisonDps || 0, skillId: id });
            }
          }
        }
        p.skillTimers[id] = t;
        continue;
      }
      switch (id) {
        case 'fireball':
          if (t <= 0) {
            const e = nearestEnemy(p.x, p.y, 450);
            if (e) {
              t = st.cd;
              const a = Math.atan2(e.y - p.y, e.x - p.x);
              G.projectiles.push({ x: p.x, y: p.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, dmg: st.dmg, friendly: true, r: 7, life: 1.4, pierce: st.pierce, burn: st.burn || 0, burnDps: st.burnDps || 0, skillId: 'fireball' });
            }
          }
          break;
        case 'chainlightning':
          if (t <= 0) {
            const first = nearestEnemy(p.x, p.y, 450);
            if (first) {
              t = st.cd;
              const hitList = [first];
              let cur = first;
              for (let i = 1; i < st.chains; i++) {
                const next = G.enemies.filter(e => e.hp > 0 && !hitList.includes(e))
                  .sort((a, b) => dist2(a, cur) - dist2(b, cur))[0];
                if (!next) break;
                hitList.push(next); cur = next;
              }
              G.lightnings.push({ pts: [{ x: p.x, y: p.y }].concat(hitList.map(e => ({ x: e.x, y: e.y }))), t: 0.15, maxT: 0.15 });
              for (const e of hitList) {
                damageEnemy(e, st.dmg * dmgMul(), { skillId: 'chainlightning' });
                if (st.slow && e.hp > 0) { e.slow = Math.max(e.slow, st.slow); e.slowDur = Math.max(e.slowDur || 0, st.slowDur); }
              }
            }
          }
          break;
        case 'shield':
          if (p.shield <= 0 && t <= 0) {
            p.shield = st.hp; p.shieldDur = st.dur; t = 0.5;
            G.particles.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: .4, maxLife: .4, color: '#4dabf7', size: p.radius + 8, ring: true });
          }
          break;
        case 'slowfield':
          if (t <= 0) {
            t = st.cd;
            let any = false;
            for (const e of G.enemies) {
              if (e.hp > 0 && dist2(e, p) < st.radius * st.radius) {
                e.slow = Math.max(e.slow, st.pct); e.slowDur = Math.max(e.slowDur || 0, 1); any = true;
              }
            }
            if (any) G.slowfieldFx.push({ x: p.x, y: p.y, r: st.radius, t: 0.3, maxT: 0.3 });
          }
          break;
        case 'spinblade':
          for (const e of G.enemies) {
            if (e.hp <= 0) continue;
            if (dist2(e, p) < st.radius * st.radius) {
              damageEnemy(e, st.dps * dt * dmgMul(), { skillId: 'spinblade' });
              if (st.stun && e.hp > 0 && Math.random() < (st.stunChance / 100) * dt * 10) e.stun = Math.max(e.stun, st.stun);
            }
          }
          break;
        case 'explosion':
          if (t <= 0) {
            let best = null, bestN = -1;
            for (const e of G.enemies) {
              if (e.hp <= 0) continue;
              const n = G.enemies.filter(o => o.hp > 0 && dist2(o, e) < st.radius * st.radius).length;
              if (n > bestN) { bestN = n; best = e; }
            }
            if (best && bestN >= 1) {
              t = st.cd;
              G.explosions.push({ x: best.x, y: best.y, r: st.radius, t: 0.4, maxT: 0.4 });
              for (const e of G.enemies) {
                if (e.hp > 0 && dist2(e, best) < st.radius * st.radius) damageEnemy(e, st.dmg * dmgMul(), { skillId: 'explosion' });
              }
              G.shake = Math.min(1, G.shake + 0.3);
            }
          }
          break;
        case 'iceshard':
          if (t <= 0) {
            const e2 = nearestEnemy(p.x, p.y, 450);
            if (e2) {
              t = st.cd;
              const a2 = Math.atan2(e2.y - p.y, e2.x - p.x);
              G.projectiles.push({ x: p.x, y: p.y, vx: Math.cos(a2) * 500, vy: Math.sin(a2) * 500, dmg: st.dmg, friendly: true, r: 6, life: 1.6, slow: st.slow || 0, slowDur: st.slowDur || 0, skillId: 'iceshard', color: '#7adfff' });
            }
          }
          break;
        case 'tidal':
          if (t <= 0) {
            t = st.cd;
            G.waves.push({ x: p.x, y: p.y, r: 40, maxR: 260, speed: 320, dmg: st.dmg, kb: st.kb, skillId: 'tidal', hit: new Set() });
          }
          break;
        case 'poison':
          if (t <= 0) {
            const e3 = nearestEnemy(p.x, p.y, 450);
            if (e3) {
              t = st.cd;
              const a3 = Math.atan2(e3.y - p.y, e3.x - p.x);
              G.projectiles.push({ x: p.x, y: p.y, vx: Math.cos(a3) * 380, vy: Math.sin(a3) * 380, dmg: st.dmg, friendly: true, r: 5, life: 1.8, poisonDps: st.pdps, skillId: 'poison', color: '#6fce58' });
            }
          }
          break;
        // multishot / lifesteal / speed / power: 패시브 (updatePlayer·dmgMul에서 적용)
      }
      p.skillTimers[id] = t;
    }
  }

  // ===== XP 구슬 =====
  function updatePickups(dt) {
    const p = G.player;
    let gained = 0;
    for (const pk of G.pickups) {
      pk.t += dt;
      const d2 = dist2(pk, p);
      if (G.tempBuffs.magnet > 0 && d2 < 400 * 400) { // 자석: XP 구슬도 흡인
        const d = Math.sqrt(d2) || 1;
        pk.x += ((p.x - pk.x) / d) * 350 * dt;
        pk.y += ((p.y - pk.y) / d) * 350 * dt;
      } else if (d2 < PLAYER.xpRadius * PLAYER.xpRadius) {
        const d = Math.sqrt(d2) || 1;
        pk.x += ((p.x - pk.x) / d) * 300 * dt;
        pk.y += ((p.y - pk.y) / d) * 300 * dt;
      }
      if (d2 < 24 * 24) { pk.dead = true; gained += pk.xp; }
    }
    G.pickups = G.pickups.filter(pk => !pk.dead);
    if (gained > 0) {
      p.xp += gained;
      while (p.xp >= xpForLevel(p.level)) {
        p.xp -= xpForLevel(p.level);
        p.level++;
        G.levelupQueue++;
      }
      if (G.levelupQueue > 0 && G.state === 'playing') openLevelup();
    }
  }

  // ===== 아이템 드롭 (영구/일시 버프) =====
  function updateItems(dt) {
    const p = G.player;
    for (const it of G.items) {
      it.t += dt;
      const d2 = dist2(it, p);
      if (G.tempBuffs.magnet > 0 && d2 < 400 * 400) { // 자석: 흡인
        const d = Math.sqrt(d2) || 1;
        it.x += ((p.x - it.x) / d) * 350 * dt;
        it.y += ((p.y - it.y) / d) * 350 * dt;
      }
      if (d2 < 28 * 28) { applyItem(it.id); it.dead = true; }
    }
    G.items = G.items.filter(it => !it.dead && it.t < 20);  // 20초 후 소멸
  }
  function applyItem(id) {
    const p = G.player, def = CONFIG.ITEMS[id];
    if (!def) return;
    if (id === 'heart') { p.maxHp += 15; p.hp += 15; }
    else if (id === 'gem') { p.dmgBonus = (p.dmgBonus || 0) + 0.08; }
    else if (id === 'rage') { G.tempBuffs.rage = 8; }
    else if (id === 'haste') { G.tempBuffs.haste = 8; }
    else if (id === 'mend') { p.hp = Math.min(p.maxHp, p.hp + p.maxHp * 0.5); }
    else if (id === 'magnet') { G.tempBuffs.magnet = 8; }
    G.floaters.push({ x: p.x, y: p.y - 26, txt: def.name, color: def.color, t: 0.9, maxT: 0.9 });
    if (G.floaters.length > 60) G.floaters.shift();
  }

  // ===== 스테이지 / 스폰 / 클리어 =====
  function updateStage(dt) {
    const stg = CONFIG.STAGES[G.stage - 1];
    G.stageTime += dt;
    // 적 스폰
    if (G.enemies.length < MAX_ENEMIES) {
      G.spawnTimer -= dt;
      if (G.spawnTimer <= 0) {
        G.spawnTimer = spawnInterval(G.stage);
        G.enemies.push(spawnEnemy());
        if (G.stage > 25 && G.enemies.length < MAX_ENEMIES) G.enemies.push(spawnEnemy('miniboss')); // 25스테이지 이후: 일반 몬스터와 1:1 미니보스
      }
    }
    // 보스 소환: 최종보스 즉시 / 미니보스 스테이지 시작 30s 후
    if (stg.boss && !G.boss && !G.bossSpawned && (stg.bossType === 'boss' || G.stageTime >= 30)) {
      G.bossSpawned = true;
      spawnBoss(G.stage);
    }
    // 클리어 판정
    let clear;
    if (stg.boss) {
      // 미니보스: 보스 격파 + 처치 수 도달 / 최종보스: 보스 격파 (clearKills 0)
      clear = G.bossSpawned && !G.boss && (G.kills >= stg.clearKills);
    } else {
      clear = G.kills >= stg.clearKills || G.stageTime >= stg.time; // 타임아웃 백스탑: 00:00 이면 클리어
    }
    if (clear) {
      G.stage++;
      if (G.stage > CONFIG.STAGES.length) { winGame(); return; }
      G.kills = 0; G.stageTime = 0; G.bossSpawned = false;
      G.player.hp = Math.min(G.player.maxHp, G.player.hp + 20);
      G.banner = '스테이지 ' + G.stage; G.bannerT = 1.8;
      G.enemies = G.enemies.filter(e => e.type !== 'boss' && e.type !== 'miniboss');
      G.projectiles = G.projectiles.filter(pr => pr.friendly);
      G.waves.length = 0;
    }
  }

  // ===== 파티클 / 이펙트 =====
  function updateParticles(dt) {
    // 보스 슬래시 경고 → 판정
    for (const w of G.bossWarnings) {
      w.t -= dt;
      if (w.t <= 0) {
        w.dead = true;
        const p = G.player;
        if (p.invulnTimer <= 0 && dist2(p, w) < (w.r + p.radius) * (w.r + p.radius)) {
          p.invulnTimer = PLAYER.invuln; p.flash = 0.25;
          p.hp -= w.dmg;
          G.shake = Math.min(1, G.shake + 0.4);
        }
      }
    }
    G.bossWarnings = G.bossWarnings.filter(w => !w.dead);
    for (const pt of G.particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
    G.particles = G.particles.filter(pt => pt.life > 0);
    for (const f of G.floaters) { f.y -= 40 * dt; f.t -= dt; }
    G.floaters = G.floaters.filter(f => f.t > 0);
    for (const s of G.slashes) s.t -= dt;
    G.slashes = G.slashes.filter(s => s.t > 0);
    for (const l of G.lightnings) l.t -= dt;
    G.lightnings = G.lightnings.filter(l => l.t > 0);
    for (const x of G.explosions) x.t -= dt;
    G.explosions = G.explosions.filter(x => x.t > 0);
    for (const s of G.slowfieldFx) s.t -= dt;
    G.slowfieldFx = G.slowfieldFx.filter(s => s.t > 0);
    if (G.bannerT > 0) G.bannerT -= dt;
    G.shake = Math.max(0, G.shake - dt * 2);
  }

  // ===== 카메라 =====
  function updateCamera(dt) {
    const p = G.player;
    const k = 1 - Math.pow(0.001, dt);
    cam.x += (p.x - canvas.width / 2 - cam.x) * k;
    cam.y += (p.y - canvas.height / 2 - cam.y) * k;
    cam.x = clamp(cam.x, 0, Math.max(0, WORLD.w - canvas.width));
    cam.y = clamp(cam.y, 0, Math.max(0, WORLD.h - canvas.height));
    if (G.shake > 0) {
      cam.x += (Math.random() - 0.5) * G.shake * 10;
      cam.y += (Math.random() - 0.5) * G.shake * 10;
    }
  }

  function skillDescLine(id, st) {
    switch (id) {
      case 'fireball': return st.dmg + ' 데미지 / ' + st.cd + '초' + (st.pierce ? ' / 관통 ' + st.pierce : '') + (st.burn ? ' / 지속 피해' : '');
      case 'chainlightning': return st.dmg + ' 데미지 / ' + st.chains + '개 체인' + (st.slow ? ' / ' + st.slow + '% 슬로우' : '');
      case 'shield': return st.hp + ' 보호막 / ' + st.dur + '초' + (st.dmgReduce ? ' / 피해 -' + st.dmgReduce + '%' : '');
      case 'multishot': return '근접 공격 ' + st.hits + '회';

      case 'split': return '격 hit 시 ' + st.count + '개로 분열';
      case 'spinblade': return '반경 ' + st.radius + ' / ' + st.dps + ' DPS' + (st.stun ? ' / 스툰' : '');
      case 'explosion': return '반경 ' + st.radius + ' / ' + st.dmg + ' 데미지 / ' + st.cd + '초';

      case 'tidal': return st.dmg + ' 대미지 웨이브 · 적 밀어내기 ' + st.kb + 'px';
      case 'poison': return st.dmg + ' 대미지 · 독 ' + st.pdps + '/s 지속 피해';
    }
    return evoDescLine(id, st);

  function evoDescLine(id, st) {
    if (!CONFIG.EVOLUTIONS[id] || !st) return '';
    const parts = [SKILL_NAMES[id] || id];
    if (st.dmg) parts.push(st.dmg + ' 대미지');
    if (st.dps) parts.push(st.dps + ' DPS');
    if (st.radius) parts.push('반경 ' + st.radius);
    if (st.cd) parts.push('CD ' + st.cd + '초');
    if (st.pierce) parts.push('관통 ' + st.pierce);
    if (st.chains) parts.push(st.chains + '개 체인');
    if (st.burnDps) parts.push('번 ' + st.burnDps + '/s');
    if (st.poisonDps) parts.push('독 ' + st.poisonDps + '/s');
    if (st.slow) parts.push(st.slow + '% 슬로우 ' + st.slowDur + '초');
    if (st.stunChance) parts.push('스툰 ' + st.stunChance + '%');
    if (st.kb) parts.push('밀어내기 ' + st.kb + 'px');
    return parts.join(' · ');
  }

  // ===== 렌더 =====
  function render() {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!G) return;
    ctx.save();
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    // 배경 타일
    if (ASSETS.bg_tile) {
      if (!bgPattern) bgPattern = ctx.createPattern(ASSETS.bg_tile, 'repeat');
      ctx.fillStyle = bgPattern;
      ctx.fillRect(cam.x - 512, cam.y - 512, canvas.width + 1024, canvas.height + 1024);
    }
    // 배경 그리드
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const grid = 100;
    const x0 = Math.floor(cam.x / grid) * grid, x1 = cam.x + canvas.width;
    const y0 = Math.floor(cam.y / grid) * grid, y1 = cam.y + canvas.height;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += grid) { ctx.moveTo(x, cam.y); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += grid) { ctx.moveTo(cam.x, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,209,102,0.25)';
    ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
    // 슬로필드 이펙트
    for (const s of G.slowfieldFx) {
      ctx.strokeStyle = 'rgba(122,229,130,' + (s.t / s.maxT * 0.5) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
    }
    // 폭발 이펙트
    for (const x of G.explosions) {
      const k = 1 - x.t / x.maxT;
      ctx.fillStyle = 'rgba(255,150,50,' + (x.t / x.maxT * 0.35) + ')';
      ctx.beginPath(); ctx.arc(x.x, x.y, x.r * (0.5 + k * 0.5), 0, Math.PI * 2); ctx.fill();
    }
    // 보스 슬래시 경고
    for (const w of G.bossWarnings) {
      ctx.fillStyle = 'rgba(230,57,70,' + (0.12 + 0.15 * Math.sin(G.time * 20)) + ')';
      ctx.strokeStyle = 'rgba(230,57,70,0.7)';
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    // XP 구슬
    for (const pk of G.pickups) {
      const pulse = 1 + 0.1 * Math.sin(G.time * 5 + pk.x * 0.05 + pk.y * 0.03);
      if (pk.crit) {
        // 5배 XP 구슬: 금색 글로우 + "5x" 라벨
        const s = 20 * pulse;
        ctx.save();
        ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 16;
        const grad = ctx.createRadialGradient(pk.x, pk.y, 2, pk.x, pk.y, s);
        grad.addColorStop(0, '#fff7d6'); grad.addColorStop(0.55, '#ffd166'); grad.addColorStop(1, 'rgba(255,170,40,0.2)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(pk.x, pk.y, s, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
        ctx.fillText('5x', pk.x, pk.y - s - 3);
      } else if (!drawAsset('xp_orb', pk.x, pk.y, (pk.xp >= 20 ? 22 : 14) * pulse)) {
        ctx.fillStyle = pk.xp >= 20 ? '#ffd166' : '#7ae582';
        ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // 아이템 드롭 (영구/일시 버프)
    for (const it of G.items) {
      const def = CONFIG.ITEMS[it.id];
      const y = it.y + Math.sin(it.t * 3) * 3;         // 위아래 붐
      ctx.fillStyle = def.color + '33';                // 글로우 (color는 #rrggbb 6자리 확인됨)
      ctx.beginPath(); ctx.arc(it.x, y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = def.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(it.x, y, 12, 0, Math.PI * 2); ctx.stroke();
      ctx.font = '16px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(def.label, it.x, y + 1);
    }
    ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
    // 적 (애니메이션 프레임 / 정적 에셋 폴백 → 원 폴백)
    for (const e of G.enemies) {
      if (!drawSprite('enemy_' + e.type, e.x, e.y, e.radius * 2, e.animT || 0, true, e.phase)) {
        ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : ENEMY_COLORS[e.type];
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
      } else if (e.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
      }
      if (e.slow > 0) { ctx.strokeStyle = 'rgba(122,229,130,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 3, 0, Math.PI * 2); ctx.stroke(); }
      if (e.type !== 'basic' || e.hp < e.maxHp) {
        const w = e.radius * 2, ratio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - w / 2, e.y - e.radius - 10, w, 4);
        ctx.fillStyle = e.type === 'boss' ? '#e63946' : '#f4a261'; ctx.fillRect(e.x - w / 2, e.y - e.radius - 10, w * ratio, 4);
      }
    }
    // 탄
    for (const pr of G.projectiles) {
      if (pr.friendly) {
        ctx.fillStyle = 'rgba(255,170,60,0.3)';
        ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r + 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = pr.color || '#ffab2e';
        ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#ff5d8f';
        ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // 링 웨이브
    for (const w of G.waves) {
      ctx.strokeStyle = 'rgba(90,200,250,0.7)';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.stroke();
    }
    // 체인 라이트닝
    for (const l of G.lightnings) {
      ctx.strokeStyle = 'rgba(125,211,252,' + (l.t / l.maxT) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      l.pts.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
      ctx.stroke();
    }
    // 플레이어
    const p = G.player;
    // 트레일
    for (let i = 0; i < p.trail.length; i++) {
      const tr = p.trail[i];
      ctx.fillStyle = 'rgba(255,255,255,' + (i / p.trail.length * 0.15) + ')';
      ctx.beginPath(); ctx.arc(tr.x, tr.y, p.radius * (i / p.trail.length), 0, Math.PI * 2); ctx.fill();
    }
    if (p.shield > 0) {
      ctx.strokeStyle = 'rgba(77,171,247,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 6, 0, Math.PI * 2); ctx.stroke();
    }
    // 스핀 블레이드 링
    const sb = p.skills.spinblade ? skillStats('spinblade', p.skills.spinblade) : null;
    if (sb) {
      ctx.strokeStyle = 'rgba(200,190,255,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.arc(p.x, p.y, sb.radius, G.time * 3, G.time * 3 + Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    // 진화 스피닝 링
    for (const id in p.skills) {
      const evoR = CONFIG.EVOLUTIONS[id];
      if (!evoR || evoR.form !== 'spin') continue;
      const sst = skillStats(id, p.skills[id]);
      if (!sst) continue;
      ctx.strokeStyle = 'rgba(160,110,230,0.55)'; ctx.lineWidth = 2; ctx.setLineDash([12, 6]);
      ctx.beginPath(); ctx.arc(p.x, p.y, sst.radius, -G.time * 2.5, -G.time * 2.5 + Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    const psz = p.radius * 2.6;
    if (!drawSprite('player', p.x, p.y, psz, p.animT || 0, p.moving, 0)) {
      ctx.fillStyle = p.flash > 0 ? '#ff8899' : '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    }
    if (p.flash > 0) {
      ctx.fillStyle = 'rgba(255,80,100,0.45)';
      ctx.beginPath(); ctx.arc(p.x, p.y, psz / 2, 0, Math.PI * 2); ctx.fill();
    }
    // 이동 방향
    ctx.strokeStyle = p.flash > 0 ? '#ff8899' : '#ffd166'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.angle) * (p.radius + 6), p.y + Math.sin(p.angle) * (p.radius + 6)); ctx.stroke();
    // 칼날 (동료)
    for (const k of G.knives) {
      const a = Math.atan2(k.vy, k.vx);
      ctx.strokeStyle = '#b197fc'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(k.x - Math.cos(a) * 7, k.y - Math.sin(a) * 7);
      ctx.lineTo(k.x + Math.cos(a) * 7, k.y + Math.sin(a) * 7); ctx.stroke();
    }
    // 동료
    if (G.companion) {
      const c = G.companion;
      const cdef = CONFIG.COMPANIONS.find(x => x.id === c.id);
      const cdrawn = drawSprite('comp_' + c.id, c.x, c.y, 26, G.time, true, 1);
      if (!cdrawn) {
        ctx.fillStyle = COMP_COLORS[c.id] || '#ffffff';
        ctx.beginPath(); ctx.arc(c.x, c.y, 11, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(c.x, c.y, 11, 0, Math.PI * 2); ctx.stroke();
        ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cdef ? cdef.icon : '❔', c.x, c.y);
        ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
      }
    }
    // 스래시
    for (const s of G.slashes) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (s.t / s.maxT * 0.8) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.range || 46, s.angle - 0.8, s.angle + 0.8); ctx.stroke();
    }
    // 파티클
    for (const pt of G.particles) {
      const a = pt.life / pt.maxLife;
      ctx.globalAlpha = a;
      if (pt.ring) {
        ctx.strokeStyle = pt.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // 데미지 숫자
    ctx.font = 'bold 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    for (const f of G.floaters) {
      ctx.globalAlpha = Math.min(1, f.t / f.maxT * 2);
      ctx.fillStyle = f.color;
      ctx.fillText(String(f.txt), f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // 스테이지 배너
    if (G.bannerT > 0) {
      ctx.globalAlpha = Math.min(1, G.bannerT / 0.4);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 48px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(G.banner, canvas.width / 2, canvas.height / 2 - 60);
      ctx.globalAlpha = 1;
    }
    // 터치 조이스틱 (화면 좌표)
    if (joy.active) {
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_R, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(joy.ox + joy.dx, joy.oy + joy.dy, 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    updateHUD();
  }

  // ===== HUD =====
  let lastSkillKey = '';
  let skillDmgEls = {};
  function fmtDmg(n) {
    if (n < 1000) return String(Math.round(n));
    if (n < 1e6) return (n / 1e3).toFixed(1) + 'K';
    return (n / 1e6).toFixed(1) + 'M';
  }
  function updateHUD() {
    const p = G.player;
    hudEl.style.display = (G.state === 'playing' || G.state === 'levelup') ? 'flex' : 'none';
    hpFill.style.width = Math.max(0, p.hp / p.maxHp * 100) + '%';
    hpText.textContent = Math.max(0, Math.ceil(p.hp)) + ' / ' + p.maxHp + (p.shield > 0 ? ' (+' + Math.ceil(p.shield) + ')' : '');
    xpFill.style.width = Math.min(100, p.xp / xpForLevel(p.level) * 100) + '%';
    xpText.textContent = Math.floor(p.xp) + ' / ' + xpForLevel(p.level);
    lvlText.textContent = p.level;
    const stg = CONFIG.STAGES[G.stage - 1];
    stageInfo.textContent = '스테이지 ' + G.stage + '/' + CONFIG.STAGES.length;
    const remain = Math.max(0, stg.time - G.stageTime);
    timer.textContent = Math.floor(remain / 60) + ':' + String(Math.floor(remain % 60)).padStart(2, '0');
    killsEl.textContent = stg.boss
      ? (G.bossSpawned ? (G.boss ? '👹 보스전  ' : '✔  ') : '보스 대기  ') + G.kills + '/' + stg.clearKills
      : G.kills + '/' + stg.clearKills;
    const act = [];
    if (G.tempBuffs.rage > 0) act.push('🔥' + Math.ceil(G.tempBuffs.rage));
    if (G.tempBuffs.haste > 0) act.push('👟' + Math.ceil(G.tempBuffs.haste));
    if (G.tempBuffs.magnet > 0) act.push('🧲' + Math.ceil(G.tempBuffs.magnet));
    buffsEl.textContent = act.join('  ');
    if (G.boss && G.boss.hp > 0) {
      bossBar.style.display = 'block';
      bossName.textContent = G.boss.type === 'boss' ? '👹 BOSS' : '👹 MINI BOSS';
      bossFill.style.width = Math.max(0, G.boss.hp / G.boss.maxHp * 100) + '%';
      bossHpText.textContent = Math.ceil(G.boss.hp) + ' / ' + Math.round(G.boss.maxHp);
    } else bossBar.style.display = 'none';
    const key = Object.entries(p.skills).map(([k, v]) => k + v).join(',');
    if (key !== lastSkillKey) {
      lastSkillKey = key;
      skillDmgEls = {};
      skillsEl.innerHTML = Object.entries(p.skills).map(([k, v]) =>
        '<div class="skill-icon" title="' + SKILL_NAMES[k] + ' Lv' + v + '">' + iconHtml(k) +
        '<span style="position:absolute;bottom:2px;right:4px;font-size:10px;color:#ffd166">' + v + '</span>' +
        '<span class="skill-dmg"></span></div>'
      ).join('');
      skillsEl.prepend(evolveBtn); // innerHTML 재빌드로 버튼 소실 방지
      const ids = Object.keys(p.skills);
      skillsEl.querySelectorAll('.skill-dmg').forEach((el, i) => { skillDmgEls[ids[i]] = el; });
    }
    for (const k in G.skillDamage) {
      const el = skillDmgEls[k];
      if (el) {
        const s = fmtDmg(G.skillDamage[k]);
        if (el.textContent !== s) el.textContent = s;
      }
    }
    evolveBtn.classList.toggle('hidden', G.state !== 'playing' || evolutionPairs(G.player).length === 0);
  }

  // ===== 레벨업 모달 =====
  function openLevelup() {
    currentChoices = rollSkillChoices(G.player, Math.random);
    if (!currentChoices.length) { G.levelupQueue = 0; G.state = 'playing'; return; } // 전 스킬 최대치 시 모달 없이 재진행
    G.state = 'levelup';
    skillChoices.innerHTML = currentChoices.map((c, i) => {
      const st = skillStats(c.id, c.toLevel);
      const lvLabel = c.toLevel === 1 ? ' (NEW)' : ' Lv' + (c.toLevel - 1) + '→' + c.toLevel;
      return '<div class="skill-choice" data-i="' + i + '">' +
        '<div class="name">' + iconHtml(c.id) + SKILL_NAMES[c.id] + lvLabel + '</div>' +
        '<div class="desc">' + (st ? skillDescLine(c.id, st) : '') + '</div></div>';
    }).join('');
    levelupModal.classList.remove('hidden');
  }
  function chooseSkill(i) {
    const c = currentChoices[i];
    if (!c || G.state !== 'levelup') return;
    G.player.skills[c.id] = c.toLevel;
    G.player.skillTimers[c.id] = 0;
    G.levelupQueue--;
    levelupModal.classList.add('hidden');
    if (G.levelupQueue > 0) openLevelup();
    else G.state = 'playing';
  }
  skillChoices.addEventListener('click', (ev) => {
    const card = ev.target.closest('.skill-choice');
    if (card) chooseSkill(+card.dataset.i);
  });

  // ===== 기록 / 종료 / 승리 =====
  function fmtTime(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function recordStats() {
    const best = Save.load() || { stage: 0, level: 0, kills: 0 };
    const cur = { stage: G.stage, level: G.player.level, kills: G.totalKills, time: Math.floor(G.time) };
    const isRecord = cur.stage > (best.stage || 0) || cur.level > (best.level || 0) || cur.kills > (best.kills || 0);
    if (isRecord) {
      Save.save({
        stage: Math.max(best.stage || 0, cur.stage),
        level: Math.max(best.level || 0, cur.level),
        kills: Math.max(best.kills || 0, cur.kills),
      });
    }
    return { cur, best, isRecord };
  }
  function statsHtml({ cur, best, isRecord }) {
    const badge = isRecord ? '<div style="color:#ffd166;font-weight:bold;margin-bottom:10px">🏆 신기록 달성!</div>' : '';
    return badge +
      '<div class="stat">스테이지 <span>' + cur.stage + ' (최고 ' + (best.stage || 0) + ')</span></div>' +
      '<div class="stat">레벨 <span>' + cur.level + ' (최고 ' + (best.level || 0) + ')</span></div>' +
      '<div class="stat">처치 <span>' + cur.kills + ' (최고 ' + (best.kills || 0) + ')</span></div>' +
      '<div class="stat">잔존 시간 <span>' + fmtTime(cur.time) + '</span></div>';
  }
  function gameOver() {
    if (G.state === 'gameover') return;
    G.state = 'gameover';
    goStats.innerHTML = statsHtml(recordStats());
    gameoverModal.classList.remove('hidden');
    hudEl.style.display = 'none';
    document.getElementById('compChip').style.display = 'none';
  }
  function winGame() {
    if (G.state === 'win') return;
    G.state = 'win';
    winStats.innerHTML = statsHtml(recordStats());
    winModal.classList.remove('hidden');
    hudEl.style.display = 'none';
    document.getElementById('compChip').style.display = 'none';
  }

  // ===== 동료 선택 =====
  let chosenCompId = localStorage.getItem('rogue_comp') || 'warrior';
  const compCardsEl = document.getElementById('compCards');
  function renderCompCards() {
    compCardsEl.innerHTML = '';
    for (const c of CONFIG.COMPANIONS) {
      const d = document.createElement('div');
      d.className = 'comp-card' + (c.id === chosenCompId ? ' selected' : '');
      d.innerHTML = '<div class="comp-icon">' + c.icon + '</div><div class="comp-name">' + c.name + '</div><div class="comp-desc">' + c.desc + '</div>';
      d.addEventListener('click', () => {
        chosenCompId = c.id;
        localStorage.setItem('rogue_comp', c.id);
        renderCompCards();
      });
      compCardsEl.appendChild(d);
    }
  }
  renderCompCards();

  // ===== 시작 / 재시작 =====
  // ===== 스킬 진화 모달 =====
  function evDesc(ev) {
    const st = skillStats(ev.id, 1);
    let s = evoDescLine(ev.id, st);
    if (st && st.maxR) s += ' · 범위 ' + st.maxR;
    return s;
  }
  function openEvolve() {
    if (G.state !== 'playing') return;
    currentEvoPairs = evolutionPairs(G.player);
    if (!currentEvoPairs.length) return;
    G.state = 'evolve'; // 루프가 'playing'일 때만 업데이트 → 자동 일시정지
    evolveChoicesEl.innerHTML = currentEvoPairs.map((ev, i) =>
      '<div class="skill-choice evo-pair" data-i="' + i + '">' +
      '<div class="name">' + iconHtml(ev.a) + ' + ' + iconHtml(ev.b) + ' → ' + iconHtml(ev.id) + ' ' + ev.name + '</div>' +
      '<div class="desc">' + evDesc(ev) + '</div></div>').join('');
    evolveChoicesEl.querySelectorAll('.evo-pair').forEach(el => el.onclick = () => chooseEvolve(+el.dataset.i));
    evolveModal.classList.remove('hidden');
  }
  function chooseEvolve(i) {
    const ev = currentEvoPairs[i];
    if (!ev) return;
    G.player.skills = evolveSkills(G.player, ev.a, ev.b);
    G.player.skillTimers[ev.id] = 0;
    evolveModal.classList.add('hidden');
    G.state = 'playing';
    updateHUD();
  }
  document.getElementById('evolveBackBtn').onclick = () => { evolveModal.classList.add('hidden'); G.state = 'playing'; };
  evolveBtn.onclick = () => openEvolve();
  function startGame() {
    G = newRun();
    G.state = 'playing';
    const _cd = CONFIG.COMPANIONS.find(x => x.id === G.companion.id);
    const _chip = document.getElementById('compChip');
    _chip.textContent = _cd.icon + ' ' + _cd.name;
    _chip.style.display = 'block';
    G.banner = '스테이지 1'; G.bannerT = 1.8;
    startModal.classList.add('hidden');
    gameoverModal.classList.add('hidden');
    winModal.classList.add('hidden');
    levelupModal.classList.add('hidden');
    evolveModal.classList.add('hidden');
    lastSkillKey = '##';
  }
  function backToMenu() {
    G = newRun();                    // 전체 리셋 (newRun이 state 'menu' 설정)
    lastSkillKey = '##';             // 스킬바 재빌드 트리거
    skillsEl.innerHTML = '';
    skillsEl.prepend(evolveBtn);
    hudEl.style.display = 'none';
    bossBar.style.display = 'none';
    document.getElementById('compChip').style.display = 'none';
    gameoverModal.classList.add('hidden');
    winModal.classList.add('hidden');
    levelupModal.classList.add('hidden');
    evolveModal.classList.add('hidden');
    startModal.classList.remove('hidden');
    renderCompCards();               // 저장된 선택(localStorage) 하이라이트 재생성
  }
  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', backToMenu);
  winRestartBtn.addEventListener('click', backToMenu);

  // ===== 입력 =====
  addEventListener('keydown', (ev) => {
    const k = ev.key.toLowerCase();
    if (k === 'r') { startGame(); return; }
    if (G && G.state === 'levelup' && ['1', '2', '3'].includes(k)) { chooseSkill(+k - 1); return; }
    keys[k] = true;
  });
  addEventListener('keyup', (ev) => { keys[ev.key.toLowerCase()] = false; });

  // ===== 터치 컨트롤 (모바일 가상 조이스틱) =====
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
  const JOY_R = 70, JOY_DEAD = 12;
  function joySetKeys() {
    keys.w = joy.dy < -JOY_DEAD; keys.s = joy.dy > JOY_DEAD;
    keys.a = joy.dx < -JOY_DEAD; keys.d = joy.dx > JOY_DEAD;
  }
  if (isTouch) {
    addEventListener('touchstart', (e) => {
      if (joy.active || e.target !== canvas) return;
      const r = canvas.getBoundingClientRect();
      const t = e.changedTouches[0];
      joy.active = true; joy.id = t.identifier;
      joy.ox = (t.clientX - r.left) * canvas.width / r.width;
      joy.oy = (t.clientY - r.top) * canvas.height / r.height;
      joy.dx = 0; joy.dy = 0;
      e.preventDefault();
    }, { passive: false });
    addEventListener('touchmove', (e) => {
      if (!joy.active) return;
      const r = canvas.getBoundingClientRect();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        if (t.identifier !== joy.id) continue;
        let dx = (t.clientX - r.left) * canvas.width / r.width - joy.ox;
        let dy = (t.clientY - r.top) * canvas.height / r.height - joy.oy;
        const len = Math.hypot(dx, dy);
        if (len > JOY_R) { dx = dx / len * JOY_R; dy = dy / len * JOY_R; }
        joy.dx = dx; joy.dy = dy;
      }
      joySetKeys();
      e.preventDefault();
    }, { passive: false });
    const joyEnd = (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier !== joy.id) continue;
        joy.active = false; joy.id = -1; joy.dx = 0; joy.dy = 0;
        joySetKeys();
      }
    };
    addEventListener('touchend', joyEnd);
    addEventListener('touchcancel', joyEnd);
  }

  // ===== 게임 루프 =====
  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, last ? (t - last) / 1000 : 0.016);
    last = t;
    if (!G) return;
    if (G.state === 'playing') {
      G.time += dt;
      for (const k of ['rage','haste','magnet']) G.tempBuffs[k] = Math.max(0, G.tempBuffs[k] - dt);
      updateSkills(dt);
      updatePlayer(dt);
      updateCompanion(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updateWaves(dt);
      updatePickups(dt);
      updateItems(dt);
      updateStage(dt);
      if (G.player.hp <= 0 && G.state === 'playing') gameOver();
    }
    if (G.state === 'playing' || G.state === 'levelup' || G.state === 'menu') updateParticles(dt);
    if (G.state === 'playing') updateCamera(dt);
    render();
  }

  // ===== 초기화 =====
  G = newRun();
  globalThis.__game = {
    get state() { return G ? G.state : null; },
    get run() { return G; },
    start: startGame,
    chooseSkill: chooseSkill,
    drawSprite,
    // 렌더 훅 — test_render_smoke.js가 render() 실제 호출을 검증하기 위함
    render, updateCamera, updateParticles, updateHUD,
  };
  requestAnimationFrame(loop);
})();
</script>
