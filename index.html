<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>⚔️ Survival Roguelike</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; }
  canvas { display: block; touch-action: none; }
  /* HUD */
  .hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 20px; display: flex; gap: 20px; align-items: center; background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent); pointer-events: none; z-index: 10; }
  .bar-wrap { flex: 1; max-width: 300px; }
  .bar-label { font-size: 12px; margin-bottom: 2px; }
  .bar { height: 16px; background: #1a1a2e; border-radius: 8px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; transition: width 0.2s; }
  .bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
  #hpFill { background: linear-gradient(90deg, #e63946, #ff6b6b); }
  #xpFill { background: linear-gradient(90deg, #7ae582, #4ade80); }
  #stageInfo { font-size: 14px; white-space: nowrap; }
  #timer { font-size: 14px; white-space: nowrap; }
  #kills { font-size: 14px; white-space: nowrap; }
  /* 보스 바 */
  #bossBar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); width: 420px; display: none; z-index: 11; }
  #bossName { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 4px; }
  #bossBar .bar { height: 20px; }
  #bossFill { background: linear-gradient(90deg, #9d0208, #e63946); width: 100%; }
  /* 스킬 아이콘 */
  #skills { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .skill-icon { width: 48px; height: 48px; background: #1a1a2e; border: 2px solid #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
  .skill-cd { position: absolute; inset: 0; background: rgba(0,0,0,0.7); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; }
  /* 모달 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden { display: none; }
  .modal { background: linear-gradient(180deg, #1a1a2e, #0a0a1a); border: 2px solid #ffd166; border-radius: 16px; padding: 30px; max-width: 600px; width: 90%; text-align: center; }
  .modal h2 { color: #ffd166; margin-bottom: 15px; font-size: 1.5em; }
  .modal p { margin-bottom: 10px; color: #ccc; }
  .skill-choices { display: flex; gap: 12px; justify-content: center; margin: 20px 0; flex-wrap: wrap; }
  .skill-choice { background: #1a1a2e; border: 2px solid #444; border-radius: 12px; padding: 15px; width: 170px; cursor: pointer; transition: all 0.2s; }
  .skill-choice:hover { border-color: #ffd166; transform: translateY(-4px); box-shadow: 0 4px 15px rgba(255,209,102,0.3); }
  .skill-choice .name { font-weight: bold; color: #ffd166; margin-bottom: 6px; }
  .skill-choice .desc { font-size: 12px; color: #aaa; }
  .btn { padding: 12px 30px; font-size: 1.1em; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: linear-gradient(180deg, #ffd166, #e6a800); color: #1a0a2e; }
  .btn:hover { transform: translateY(-2px); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 15px 0; }
  .stat { background: #111; padding: 8px; border-radius: 6px; }
  .stat span { color: #ffd166; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD -->
<div class="hud" id="hud" style="display:none">
  <div class="bar-wrap">
    <div class="bar-label">HP</div>
    <div class="bar"><div class="bar-fill" id="hpFill"></div><div class="bar-text" id="hpText"></div></div>
  </div>
  <div class="bar-wrap">
    <div class="bar-label">XP (Lv <span id="lvlText">1</span>)</div>
    <div class="bar"><div class="bar-fill" id="xpFill"></div><div class="bar-text" id="xpText"></div></div>
  </div>
  <div id="stageInfo">Stage 1</div>
  <div id="timer">2:00</div>
  <div id="kills">0/40</div>
</div>

<!-- 보스 바 -->
<div id="bossBar">
  <div id="bossName">BOSS</div>
  <div class="bar"><div class="bar-fill" id="bossFill"></div><div class="bar-text" id="bossHpText"></div></div>
</div>

<!-- 스킬 아이콘 -->
<div id="skills"></div>

<!-- 시작 화면 -->
<div class="modal-overlay" id="startModal">
  <div class="modal">
    <img src="assets/title_art.png" style="width:100%;border-radius:10px;margin-bottom:14px" onerror="this.style.display='none'">
    <h2>⚔️ Survival Roguelike</h2>
    <p>WASD 이동 — 근접 자동공격 — 3택1 스킬 성장</p>
    <p style="font-size:12px;color:#888">R: 재시작</p>
    <br>
    <button class="btn" id="startBtn">게임 시작</button>
  </div>
</div>

<!-- 레벨업 모달 -->
<div class="modal-overlay hidden" id="levelupModal">
  <div class="modal">
    <h2>🎉 Level Up!</h2>
    <p>스킬을 선택하세요</p>
    <div class="skill-choices" id="skillChoices"></div>
  </div>
</div>

<!-- 게임오버 모달 -->
<div class="modal-overlay hidden" id="gameoverModal">
  <div class="modal">
    <h2>💀 Game Over</h2>
    <div class="stats" id="goStats"></div>
    <button class="btn" id="restartBtn">다시 시작</button>
  </div>
</div>

<!-- 승리 모달 -->
<div class="modal-overlay hidden" id="winModal">
  <div class="modal">
    <h2>🏆 Victory!</h2>
    <div class="stats" id="winStats"></div>
    <button class="btn" id="winRestartBtn">다시 시작</button>
  </div>
</div>

<script src="game-logic.js"></script>
<script>
// ===== IIFE: 게임 클라이언트 =====
(function() {
  // ===== 상수 =====
  const PLAYER = {
    speed: 220, hp: 120, maxHp: 120,
    atkDmg: 18, atkCd: 0.5, atkRange: 40,
    xpRadius: 60, invuln: 0.4, radius: 14,
  };
  const WORLD = { w: 2400, h: 1800 };
  const ENEMY_COLORS = { basic: '#e63946', fast: '#7ae582', tanky: '#b197fc', ranged: '#4dabf7', miniboss: '#4ade80', boss: '#ff2e63' };
  const MAX_ENEMIES = 60;

  // ===== Canvas =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  addEventListener('resize', resize);

  // ===== 에셋 로더 =====
  const ASSET_NAMES = ['player','enemy_basic','enemy_fast','enemy_tanky','enemy_ranged','enemy_miniboss','enemy_boss','xp_orb','icon_fireball','icon_chainlightning','icon_shield','icon_multishot','icon_lifesteal','icon_slowfield','icon_split','icon_spinblade','icon_explosion','icon_speed','bg_tile','title_art'];
  const ASSETS = {};
  let bgPattern = null;
  ASSET_NAMES.forEach((name) => {
    const img = new Image();
    img.onload = () => { ASSETS[name] = img; };
    img.src = 'assets/' + name + '.png';
  });
  function drawAsset(name, x, y, size) {
    const a = ASSETS[name];
    if (!a) return false;
    ctx.drawImage(a, x - size / 2, y - size / 2, size, size);
    return true;
  }
  function iconHtml(id) {
    return ASSETS['icon_' + id]
      ? '<img src="assets/icon_' + id + '.png" style="width:24px;height:24px;vertical-align:middle;margin-right:5px;border-radius:6px">'
      : SKILL_ICONS[id] + ' ';
  }

  // ===== 게임 상태 =====
  let G = null;
  const cam = { x: 0, y: 0 };
  const keys = {};
  let currentChoices = [];

  function newRun() {
    return {
      state: 'menu', time: 0, stage: 1,
      player: {
        x: WORLD.w/2, y: WORLD.h/2, radius: 14,
        hp: PLAYER.hp, maxHp: PLAYER.maxHp,
        shield: 0, shieldDur: 0,
        xp: 0, level: 1,
        skills: {}, atkTimer: 0, invulnTimer: 0, skillTimers: {},
        facing: { x: 1, y: 0 }, flash: 0, trail: [],
      },
      enemies: [], projectiles: [], pickups: [], particles: [], slashes: [], floaters: [],
      lightnings: [], explosions: [], slowfieldFx: [], bossWarnings: [],
      levelupQueue: 0, banner: '', bannerT: 0, bossSpawned: false,
      kills: 0, totalKills: 0,
      spawnTimer: 0, boss: null, stageTime: 0, shake: 0,
    };
  }

  // ===== 저장소 =====
  const Save = {
    key: 'survival_roguelike_best',
    load() { try { return JSON.parse(localStorage.getItem(this.key)) || null; } catch { return null; } },
    save(rec) { try { localStorage.setItem(this.key, JSON.stringify(rec)); } catch {} },
  };

  // ===== 유틸 =====
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx*dx + dy*dy; }
  function nearestEnemy(x, y, range) {
    return G.enemies.filter(e => e.hp > 0 && dist2(e, {x,y}) < range*range)
      .sort((a,b) => dist2(a,{x,y}) - dist2(b,{x,y}))[0];
  }

  // ===== 스폰 =====
  function spawnEnemy() {
    const stage = G.stage;
    const type = rollEnemyType(stage, Math.random);
    const base = CONFIG.ENEMIES[type];
    const scale = enemyHpScale(stage);
    const angle = Math.random() * Math.PI * 2;
    const dist = 500 + Math.random() * 300;
    const e = {
      type, x: clamp(G.player.x + Math.cos(angle)*dist, 50, WORLD.w-50),
      y: clamp(G.player.y + Math.sin(angle)*dist, 50, WORLD.h-50),
      hp: Math.round(base.hp * scale), maxHp: Math.round(base.hp * scale),
      speed: base.speed, dmg: Math.round(base.dmg * enemyDmgScale(stage)),
      xp: base.xp, radius: type === 'tanky' ? 20 : type === 'miniboss' ? 30 : 13,
      slow: 0, stun: 0, hitFlash: 0,
      shootTimer: (type === 'ranged' || type === 'miniboss' || type === 'boss') ? 1 : 0,
    };
    return e;
  }

  function spawnBoss(stage) {
    const base = CONFIG.ENEMIES[stage === 5 ? 'miniboss' : 'boss'];
    const angle = Math.random() * Math.PI * 2;
    const e = {
      type: stage === 5 ? 'miniboss' : 'boss',
      x: G.player.x + Math.cos(angle)*600, y: G.player.y + Math.sin(angle)*600,
      hp: base.hp * enemyHpScale(stage), maxHp: base.hp * enemyHpScale(stage),
      speed: base.speed, dmg: base.dmg * enemyDmgScale(stage),
      xp: base.xp, radius: stage === 5 ? 30 : 44,
      slow: 0, stun: 0, hitFlash: 0, shootTimer: 2,
    };
    G.boss = e;
    G.enemies.push(e);
  }

  // ===== 데미지 =====
  function damageEnemy(e, dmg, opts = {}) {
    e.hp -= dmg;
    e.hitFlash = 0.1;
    if (opts.stun) e.stun = Math.max(e.stun, opts.stun);
    // 데미지 숫자
    if (dmg >= 1) {
      G.floaters.push({ x: e.x + (Math.random()-.5)*16, y: e.y - e.radius - 8, txt: Math.round(dmg), color: opts.fromMelee ? '#ffffff' : '#ffd166', t: 0.7, maxT: 0.7 });
      if (G.floaters.length > 60) G.floaters.shift();
    }
    // 흡혈
    const ls = G.player.skills.lifesteal;
    if (ls && opts.fromMelee) {
      const st = skillStats('lifesteal', ls);
      G.player.hp = Math.min(G.player.maxHp, G.player.hp + Math.round(dmg * st.pct / 100));
    }
    if (e.hp <= 0) {
      // 처치 이펙트
      for (let i = 0; i < (e.type === 'boss' ? 40 : 8); i++) {
        G.particles.push({
          x: e.x, y: e.y, vx: (Math.random()-.5)*200, vy: (Math.random()-.5)*200,
          life: .5, maxLife: .5, color: e.type === 'boss' ? '#ffd166' : '#e63946', size: 3,
        });
      }
      if (e.type === 'boss') G.boss = null;
      G.kills++; G.totalKills++;
      const lsK = G.player.skills.lifesteal;
      if (lsK) { const stK = skillStats('lifesteal', lsK); if (stK && stK.killHeal) G.player.hp = Math.min(G.player.maxHp, G.player.hp + stK.killHeal); }
      G.pickups.push({ x: e.x, y: e.y, xp: e.xp, r: e.xp >= 20 ? 10 : 5, t: 0 });
      G.shake = Math.min(1, G.shake + (e.type === 'boss' ? 0.5 : 0.1));
    }
  }

  // ===== 플레이어 업데이트 =====
  function updatePlayer(dt) {
    const p = G.player;
    let dx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
    let dy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
    if (dx || dy) {
      const len = Math.hypot(dx, dy); dx /= len; dy /= len;
      p.facing = { x: dx, y: dy };
      const spd = PLAYER.speed * (1 + (p.skills.speed ? skillStats('speed', p.skills.speed).pct : 0) / 100);
      p.x = clamp(p.x + dx * spd * dt, PLAYER.radius, WORLD.w - PLAYER.radius);
      p.y = clamp(p.y + dy * spd * dt, PLAYER.radius, WORLD.h - PLAYER.radius);
    }
    // 이동 트레일
    p.trail.push({ x: p.x, y: p.y });
    if (p.trail.length > 8) p.trail.shift();
    p.atkTimer -= dt;
    p.invulnTimer -= dt;
    p.flash = Math.max(0, p.flash - dt);
    if (p.shield > 0) { p.shieldDur -= dt; if (p.shieldDur <= 0) p.shield = 0; }

    // 근접 자동공격
    if (p.atkTimer <= 0) {
      const hits = p.skills.multishot ? skillStats('multishot', p.skills.multishot).hits : 1;
      const range = PLAYER.atkRange + (p.skills.multishot && p.skills.multishot >= 3 ? 10 : 0) + p.radius;
      const targets = G.enemies.filter(e => e.hp > 0 && dist2(e, p) < range * range)
        .sort((a, b) => dist2(a, p) - dist2(b, p)).slice(0, 1);
      if (targets.length) {
        const cdMul = p.skills.multishot ? (p.skills.multishot >= 4 ? 0.9 : 1) * (p.skills.multishot >= 5 ? 0.9 : 1) : 1;
        p.atkTimer = PLAYER.atkCd * cdMul / hits;
        for (const t of targets) {
          for (let i = 0; i < hits; i++) damageEnemy(t, PLAYER.atkDmg * (i === 0 ? 1 : 0.5), { fromMelee: true });
          G.particles.push({ x: t.x, y: t.y, vx: (Math.random()-.5)*80, vy: (Math.random()-.5)*80, life: .12, maxLife: .12, color: '#fff', size: 4 });
        }
        // 슬래시 이펙트
        const a = Math.atan2(targets[0].y - p.y, targets[0].x - p.x);
        G.slashes.push({ x: p.x, y: p.y, angle: a, t: 0.16, maxT: 0.16 });
      }
    }
  }

  // ===== 적 업데이트 (AI 4종 + 보스) =====
  function updateEnemies(dt) {
    const p = G.player;
    for (const e of G.enemies) {
      if (e.hp <= 0) continue;
      e.hitFlash = Math.max(0, e.hitFlash - dt);
      // 연소
      if (e.burn > 0) {
        e.burn -= dt;
        damageEnemy(e, e.burnDps * dt);
        if (e.hp <= 0) continue;
      }
      // 스톤
      if (e.stun > 0) { e.stun -= dt; continue; }
      // 감속
      let mul = 1;
      if (e.slowDur > 0) { e.slowDur -= dt; mul = 1 - e.slow / 100; if (e.slowDur <= 0) e.slow = 0; }
      const dx = p.x - e.x, dy = p.y - e.y;
      const d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      let mx = 0, my = 0;
      const spd = e.speed * mul;
      switch (e.type) {
        case 'basic': mx = nx; my = ny; break;
        case 'fast': {
          const wob = Math.sin(G.time * 4 + e.x * 0.01 + e.y * 0.01) * 0.5;
          mx = nx + -ny * wob; my = ny + nx * wob;
          const l = Math.hypot(mx, my) || 1; mx /= l; my /= l;
          break;
        }
        case 'tanky': mx = nx; my = ny; break;
        case 'ranged':
          if (d < 150) { mx = -nx; my = -ny; }
          else if (d > 250) { mx = nx; my = ny; }
          else { mx = -ny * 0.6; my = nx * 0.6; }
          e.shootTimer -= dt;
          if (e.shootTimer <= 0 && d < 400) {
            e.shootTimer = 1.5;
            G.projectiles.push({ x: e.x, y: e.y, vx: nx * 260, vy: ny * 260, dmg: e.dmg, friendly: false, r: 5, life: 3 });
          }
          break;
        case 'miniboss':
          mx = nx; my = ny;
          e.shootTimer -= dt;
          if (e.shootTimer <= 0) {
            e.shootTimer = 2;
            for (let i = 0; i < 8; i++) {
              const a = (i / 8) * Math.PI * 2 + G.time;
              G.projectiles.push({ x: e.x, y: e.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, dmg: e.dmg, friendly: false, r: 6, life: 4 });
            }
          }
          break;
        case 'boss':
          mx = nx; my = ny;
          e.shootTimer -= dt;
          if (e.shootTimer <= 0) {
            e.shootTimer = 2;
            for (let i = 0; i < 8; i++) {
              const a = (i / 8) * Math.PI * 2 + G.time * 0.7;
              G.projectiles.push({ x: e.x, y: e.y, vx: Math.cos(a) * 240, vy: Math.sin(a) * 240, dmg: e.dmg * 0.6, friendly: false, r: 6, life: 4 });
            }
          }
          if (e.slashTimer === undefined) e.slashTimer = 3;
          e.slashTimer -= dt;
          if (e.slashTimer <= 0) {
            e.slashTimer = 3;
            G.bossWarnings.push({ x: p.x, y: p.y, r: 120, t: 0.5, maxT: 0.5, dmg: e.dmg });
          }
          break;
      }
      e.x = clamp(e.x + mx * spd * dt, 20, WORLD.w - 20);
      e.y = clamp(e.y + my * spd * dt, 20, WORLD.h - 20);
      // 충돌 데미지
      const rr = e.radius + p.radius;
      if (d < rr && p.invulnTimer <= 0) {
        p.invulnTimer = PLAYER.invuln;
        p.flash = 0.2;
        let dmg = e.dmg;
        if (p.shield > 0) {
          const sh = p.skills.shield ? skillStats('shield', p.skills.shield) : null;
          if (sh && sh.dmgReduce) dmg *= (1 - sh.dmgReduce / 100);
          p.shield = Math.max(0, p.shield - dmg);
          if (p.shield === 0) p.shieldDur = 0;
        } else p.hp -= dmg;
        G.shake = Math.min(1, G.shake + 0.2);
        for (let i = 0; i < 6; i++) G.particles.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 150, vy: (Math.random() - .5) * 150, life: .3, maxLife: .3, color: '#e63946', size: 3 });
      }
    }
    G.enemies = G.enemies.filter(e => e.hp > 0);
  }

  // ===== 투사체 업데이트 =====
  function updateProjectiles(dt) {
    const p = G.player;
    for (const pr of G.projectiles) {
      pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
      if (pr.life <= 0) { pr.dead = true; continue; }
      if (pr.x < 0 || pr.x > WORLD.w || pr.y < 0 || pr.y > WORLD.h) { pr.dead = true; continue; }
      if (pr.friendly) {
        for (const e of G.enemies) {
          if (e.hp <= 0 || (pr.hitSet && pr.hitSet.has(e))) continue;
          const rr = e.radius + pr.r;
          if (dist2(e, pr) < rr * rr) {
            damageEnemy(e, pr.dmg);
            if (pr.burn && e.hp > 0) { e.burn = pr.burn; e.burnDps = pr.burnDps; }
            const sp = p.skills.split ? skillStats('split', p.skills.split) : null;
            if (sp && !pr.noSplit) {
              const base = Math.atan2(pr.vy, pr.vx);
              for (let i = 0; i < sp.count; i++) {
                const a = base + (i - (sp.count - 1) / 2) * 0.5;
                G.projectiles.push({ x: pr.x, y: pr.y, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, dmg: pr.dmg * 0.5, friendly: true, r: 4, life: 1, noSplit: true });
              }
            }
            if (pr.pierce > 0) { pr.pierce--; if (!pr.hitSet) pr.hitSet = new Set(); pr.hitSet.add(e); }
            else { pr.dead = true; }
            if (pr.dead) break;
          }
        }
      } else {
        const rr = p.radius + pr.r;
        if (dist2(p, pr) < rr * rr && p.invulnTimer <= 0) {
          pr.dead = true;
          p.invulnTimer = PLAYER.invuln; p.flash = 0.2;
          let dmg = pr.dmg;
          if (p.shield > 0) {
            const sh = p.skills.shield ? skillStats('shield', p.skills.shield) : null;
            if (sh && sh.dmgReduce) dmg *= (1 - sh.dmgReduce / 100);
            p.shield = Math.max(0, p.shield - dmg);
          } else p.hp -= dmg;
          G.shake = Math.min(1, G.shake + 0.15);
        }
      }
    }
    G.projectiles = G.projectiles.filter(pr => !pr.dead);
  }

  // ===== 스킬 업데이트 (자동 발동) =====
  function updateSkills(dt) {
    const p = G.player;
    for (const id in p.skills) {
      const lv = p.skills[id];
      const st = skillStats(id, lv);
      if (!st) continue;
      p.skillTimers[id] = (p.skillTimers[id] === undefined ? 0 : p.skillTimers[id]) - dt;
      let t = p.skillTimers[id];
      switch (id) {
        case 'fireball':
          if (t <= 0) {
            const e = nearestEnemy(p.x, p.y, 450);
            if (e) {
              t = st.cd;
              const a = Math.atan2(e.y - p.y, e.x - p.x);
              G.projectiles.push({ x: p.x, y: p.y, vx: Math.cos(a) * 420, vy: Math.sin(a) * 420, dmg: st.dmg, friendly: true, r: 7, life: 1.4, pierce: st.pierce, burn: st.burn || 0, burnDps: st.burnDps || 0 });
            }
          }
          break;
        case 'chainlightning':
          if (t <= 0) {
            const first = nearestEnemy(p.x, p.y, 450);
            if (first) {
              t = st.cd;
              const hitList = [first];
              let cur = first;
              for (let i = 1; i < st.chains; i++) {
                const next = G.enemies.filter(e => e.hp > 0 && !hitList.includes(e))
                  .sort((a, b) => dist2(a, cur) - dist2(b, cur))[0];
                if (!next) break;
                hitList.push(next); cur = next;
              }
              G.lightnings.push({ pts: [{ x: p.x, y: p.y }].concat(hitList.map(e => ({ x: e.x, y: e.y }))), t: 0.15, maxT: 0.15 });
              for (const e of hitList) {
                damageEnemy(e, st.dmg);
                if (st.slow && e.hp > 0) { e.slow = Math.max(e.slow, st.slow); e.slowDur = Math.max(e.slowDur || 0, st.slowDur); }
              }
            }
          }
          break;
        case 'shield':
          if (p.shield <= 0 && t <= 0) {
            p.shield = st.hp; p.shieldDur = st.dur; t = 0.5;
            G.particles.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: .4, maxLife: .4, color: '#4dabf7', size: p.radius + 8, ring: true });
          }
          break;
        case 'slowfield':
          if (t <= 0) {
            t = st.cd;
            let any = false;
            for (const e of G.enemies) {
              if (e.hp > 0 && dist2(e, p) < st.radius * st.radius) {
                e.slow = Math.max(e.slow, st.pct); e.slowDur = Math.max(e.slowDur || 0, 1); any = true;
              }
            }
            if (any) G.slowfieldFx.push({ x: p.x, y: p.y, r: st.radius, t: 0.3, maxT: 0.3 });
          }
          break;
        case 'spinblade':
          for (const e of G.enemies) {
            if (e.hp <= 0) continue;
            if (dist2(e, p) < st.radius * st.radius) {
              damageEnemy(e, st.dps * dt);
              if (st.stun && e.hp > 0 && Math.random() < (st.stunChance / 100) * dt * 10) e.stun = Math.max(e.stun, st.stun);
            }
          }
          break;
        case 'explosion':
          if (t <= 0) {
            let best = null, bestN = -1;
            for (const e of G.enemies) {
              if (e.hp <= 0) continue;
              const n = G.enemies.filter(o => o.hp > 0 && dist2(o, e) < st.radius * st.radius).length;
              if (n > bestN) { bestN = n; best = e; }
            }
            if (best && bestN >= 1) {
              t = st.cd;
              G.explosions.push({ x: best.x, y: best.y, r: st.radius, t: 0.4, maxT: 0.4 });
              for (const e of G.enemies) {
                if (e.hp > 0 && dist2(e, best) < st.radius * st.radius) damageEnemy(e, st.dmg);
              }
              G.shake = Math.min(1, G.shake + 0.3);
            }
          }
          break;
        // multishot / lifesteal / speed: 패시브 (updatePlayer·damageEnemy에서 적용)
      }
      p.skillTimers[id] = t;
    }
  }

  // ===== XP 구슬 =====
  function updatePickups(dt) {
    const p = G.player;
    let gained = 0;
    for (const pk of G.pickups) {
      pk.t += dt;
      const d2 = dist2(pk, p);
      if (d2 < PLAYER.xpRadius * PLAYER.xpRadius) {
        const d = Math.sqrt(d2) || 1;
        pk.x += ((p.x - pk.x) / d) * 300 * dt;
        pk.y += ((p.y - pk.y) / d) * 300 * dt;
      }
      if (d2 < 24 * 24) { pk.dead = true; gained += pk.xp; }
    }
    G.pickups = G.pickups.filter(pk => !pk.dead);
    if (gained > 0) {
      p.xp += gained;
      while (p.xp >= xpForLevel(p.level)) {
        p.xp -= xpForLevel(p.level);
        p.level++;
        G.levelupQueue++;
      }
      if (G.levelupQueue > 0 && G.state === 'playing') openLevelup();
    }
  }

  // ===== 스테이지 / 스폰 / 클리어 =====
  function updateStage(dt) {
    const stg = CONFIG.STAGES[G.stage - 1];
    G.stageTime += dt;
    // 적 스폰
    if (G.enemies.length < MAX_ENEMIES) {
      G.spawnTimer -= dt;
      if (G.spawnTimer <= 0) {
        G.spawnTimer = spawnInterval(G.stage);
        G.enemies.push(spawnEnemy());
      }
    }
    // 보스 소환: 5스테이지 진입 시 / 8스테이지 30s 후
    if (stg.boss && !G.boss && !G.bossSpawned && (G.stage === 5 || G.stageTime >= 30)) {
      G.bossSpawned = true;
      spawnBoss(G.stage);
    }
    // 클리어 판정
    let clear = false;
    if (G.stage === 8) {
      clear = G.bossSpawned && !G.boss;
    } else if (stg.boss) {
      clear = G.bossSpawned && !G.boss && G.kills >= stg.clearKills;
    } else {
      clear = G.kills >= stg.clearKills;
    }
    if (clear) {
      if (G.stage === 8) { winGame(); return; }
      G.stage++;
      G.kills = 0; G.stageTime = 0; G.bossSpawned = false;
      G.player.hp = Math.min(G.player.maxHp, G.player.hp + 20);
      G.banner = '스테이지 ' + G.stage; G.bannerT = 1.8;
      G.enemies = G.enemies.filter(e => e.type !== 'boss' && e.type !== 'miniboss');
      G.projectiles = G.projectiles.filter(pr => pr.friendly);
    }
  }

  // ===== 파티클 / 이펙트 =====
  function updateParticles(dt) {
    // 보스 슬래시 경고 → 판정
    for (const w of G.bossWarnings) {
      w.t -= dt;
      if (w.t <= 0) {
        w.dead = true;
        const p = G.player;
        if (p.invulnTimer <= 0 && dist2(p, w) < (w.r + p.radius) * (w.r + p.radius)) {
          p.invulnTimer = PLAYER.invuln; p.flash = 0.25;
          p.hp -= w.dmg;
          G.shake = Math.min(1, G.shake + 0.4);
        }
      }
    }
    G.bossWarnings = G.bossWarnings.filter(w => !w.dead);
    for (const pt of G.particles) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; }
    G.particles = G.particles.filter(pt => pt.life > 0);
    for (const f of G.floaters) { f.y -= 40 * dt; f.t -= dt; }
    G.floaters = G.floaters.filter(f => f.t > 0);
    for (const s of G.slashes) s.t -= dt;
    G.slashes = G.slashes.filter(s => s.t > 0);
    for (const l of G.lightnings) l.t -= dt;
    G.lightnings = G.lightnings.filter(l => l.t > 0);
    for (const x of G.explosions) x.t -= dt;
    G.explosions = G.explosions.filter(x => x.t > 0);
    for (const s of G.slowfieldFx) s.t -= dt;
    G.slowfieldFx = G.slowfieldFx.filter(s => s.t > 0);
    if (G.bannerT > 0) G.bannerT -= dt;
    G.shake = Math.max(0, G.shake - dt * 2);
  }

  // ===== 카메라 =====
  function updateCamera(dt) {
    const p = G.player;
    const k = 1 - Math.pow(0.001, dt);
    cam.x += (p.x - canvas.width / 2 - cam.x) * k;
    cam.y += (p.y - canvas.height / 2 - cam.y) * k;
    cam.x = clamp(cam.x, 0, Math.max(0, WORLD.w - canvas.width));
    cam.y = clamp(cam.y, 0, Math.max(0, WORLD.h - canvas.height));
    if (G.shake > 0) {
      cam.x += (Math.random() - 0.5) * G.shake * 10;
      cam.y += (Math.random() - 0.5) * G.shake * 10;
    }
  }

  const SKILL_ICONS = { fireball: '🔥', chainlightning: '⚡', shield: '🛡️', multishot: '🗡️', lifesteal: '🩸', slowfield: '❄️', split: '✳️', spinblade: '🌀', explosion: '💥', speed: '💨' };
  const SKILL_NAMES = { fireball: '파이어볼', chainlightning: '체인 라이트닝', shield: '시ールド', multishot: '멀티샷', lifesteal: '라이프스틸', slowfield: '슬로필드', split: '스플릿', spinblade: '스핀 블레이드', explosion: '익스플로전', speed: '이동 속도' };
  function skillDescLine(id, st) {
    switch (id) {
      case 'fireball': return st.dmg + ' 데미지 / ' + st.cd + '초' + (st.pierce ? ' / 관통 ' + st.pierce : '') + (st.burn ? ' / 지속 피해' : '');
      case 'chainlightning': return st.dmg + ' 데미지 / ' + st.chains + '개 체인' + (st.slow ? ' / ' + st.slow + '% 슬로우' : '');
      case 'shield': return st.hp + ' 보호막 / ' + st.dur + '초' + (st.dmgReduce ? ' / 피해 -' + st.dmgReduce + '%' : '');
      case 'multishot': return '근접 공격 ' + st.hits + '회';
      case 'lifesteal': return '격 hit 시 ' + st.pct + '% 흡혈' + (st.killHeal ? ' / 처치 시 +' + st.killHeal : '');
      case 'slowfield': return '반경 ' + st.radius + ' / ' + st.pct + '% 슬로우 / ' + st.cd + '초';
      case 'split': return '격 hit 시 ' + st.count + '개로 분열';
      case 'spinblade': return '반경 ' + st.radius + ' / ' + st.dps + ' DPS' + (st.stun ? ' / 스툰' : '');
      case 'explosion': return '반경 ' + st.radius + ' / ' + st.dmg + ' 데미지 / ' + st.cd + '초';
      case 'speed': return '이동 속도 +' + st.pct + '%';
    }
    return '';
  }

  // ===== 렌더 =====
  function render() {
    ctx.fillStyle = '#0a0a12';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!G) return;
    ctx.save();
    ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
    // 배경 타일
    if (ASSETS.bg_tile) {
      if (!bgPattern) bgPattern = ctx.createPattern(ASSETS.bg_tile, 'repeat');
      ctx.fillStyle = bgPattern;
      ctx.fillRect(cam.x - 512, cam.y - 512, canvas.width + 1024, canvas.height + 1024);
    }
    // 배경 그리드
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    const grid = 100;
    const x0 = Math.floor(cam.x / grid) * grid, x1 = cam.x + canvas.width;
    const y0 = Math.floor(cam.y / grid) * grid, y1 = cam.y + canvas.height;
    ctx.beginPath();
    for (let x = x0; x <= x1; x += grid) { ctx.moveTo(x, cam.y); ctx.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += grid) { ctx.moveTo(cam.x, y); ctx.lineTo(x1, y); }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,209,102,0.25)';
    ctx.strokeRect(0, 0, WORLD.w, WORLD.h);
    // 슬로필드 이펙트
    for (const s of G.slowfieldFx) {
      ctx.strokeStyle = 'rgba(122,229,130,' + (s.t / s.maxT * 0.5) + ')';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.stroke();
    }
    // 폭발 이펙트
    for (const x of G.explosions) {
      const k = 1 - x.t / x.maxT;
      ctx.fillStyle = 'rgba(255,150,50,' + (x.t / x.maxT * 0.35) + ')';
      ctx.beginPath(); ctx.arc(x.x, x.y, x.r * (0.5 + k * 0.5), 0, Math.PI * 2); ctx.fill();
    }
    // 보스 슬래시 경고
    for (const w of G.bossWarnings) {
      ctx.fillStyle = 'rgba(230,57,70,' + (0.12 + 0.15 * Math.sin(G.time * 20)) + ')';
      ctx.strokeStyle = 'rgba(230,57,70,0.7)';
      ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    // XP 구슬
    for (const pk of G.pickups) {
      if (!drawAsset('xp_orb', pk.x, pk.y, pk.xp >= 20 ? 22 : 14)) {
        ctx.fillStyle = pk.xp >= 20 ? '#ffd166' : '#7ae582';
        ctx.beginPath(); ctx.arc(pk.x, pk.y, pk.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // 적
    for (const e of G.enemies) {
      if (!drawAsset('enemy_' + e.type, e.x, e.y, e.radius * 2)) {
        ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : ENEMY_COLORS[e.type];
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
      } else if (e.hitFlash > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
      }
      if (e.slow > 0) { ctx.strokeStyle = 'rgba(122,229,130,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius + 3, 0, Math.PI * 2); ctx.stroke(); }
      if (e.type !== 'basic' || e.hp < e.maxHp) {
        const w = e.radius * 2, ratio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(e.x - w / 2, e.y - e.radius - 10, w, 4);
        ctx.fillStyle = e.type === 'boss' ? '#e63946' : '#f4a261'; ctx.fillRect(e.x - w / 2, e.y - e.radius - 10, w * ratio, 4);
      }
    }
    // 탄
    for (const pr of G.projectiles) {
      if (pr.friendly) {
        ctx.fillStyle = 'rgba(255,170,60,0.3)';
        ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r + 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffab2e';
        ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = '#ff5d8f';
        ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    // 체인 라이트닝
    for (const l of G.lightnings) {
      ctx.strokeStyle = 'rgba(125,211,252,' + (l.t / l.maxT) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      l.pts.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
      ctx.stroke();
    }
    // 플레이어
    const p = G.player;
    // 트레일
    for (let i = 0; i < p.trail.length; i++) {
      const tr = p.trail[i];
      ctx.fillStyle = 'rgba(255,255,255,' + (i / p.trail.length * 0.15) + ')';
      ctx.beginPath(); ctx.arc(tr.x, tr.y, p.radius * (i / p.trail.length), 0, Math.PI * 2); ctx.fill();
    }
    if (p.shield > 0) {
      ctx.strokeStyle = 'rgba(77,171,247,0.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 6, 0, Math.PI * 2); ctx.stroke();
    }
    // 스핀 블레이드 링
    const sb = p.skills.spinblade ? skillStats('spinblade', p.skills.spinblade) : null;
    if (sb) {
      ctx.strokeStyle = 'rgba(200,190,255,0.5)'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.arc(p.x, p.y, sb.radius, G.time * 3, G.time * 3 + Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
    const psz = p.radius * 2.6;
    if (!drawAsset('player', p.x, p.y, psz)) {
      ctx.fillStyle = p.flash > 0 ? '#ff8899' : '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    }
    if (p.flash > 0) {
      ctx.fillStyle = 'rgba(255,80,100,0.45)';
      ctx.beginPath(); ctx.arc(p.x, p.y, psz / 2, 0, Math.PI * 2); ctx.fill();
    }
    // 이동 방향
    ctx.strokeStyle = p.flash > 0 ? '#ff8899' : '#ffd166'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(p.angle) * (p.radius + 6), p.y + Math.sin(p.angle) * (p.radius + 6)); ctx.stroke();
    // 스래시
    for (const s of G.slashes) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (s.t / s.maxT * 0.8) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(s.x, s.y, 46, s.angle - 0.8, s.angle + 0.8); ctx.stroke();
    }
    // 파티클
    for (const pt of G.particles) {
      const a = pt.life / pt.maxLife;
      ctx.globalAlpha = a;
      if (pt.ring) {
        ctx.strokeStyle = pt.color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.fillStyle = pt.color;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * a, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    // 데미지 숫자
    ctx.font = 'bold 13px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    for (const f of G.floaters) {
      ctx.globalAlpha = Math.min(1, f.t / f.maxT * 2);
      ctx.fillStyle = f.color;
      ctx.fillText(String(f.text), f.x, f.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // 스테이지 배너
    if (G.bannerT > 0) {
      ctx.globalAlpha = Math.min(1, G.bannerT / 0.4);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 48px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(G.banner, canvas.width / 2, canvas.height / 2 - 60);
      ctx.globalAlpha = 1;
    }
    // 터치 조이스틱 (화면 좌표)
    if (joy.active) {
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(joy.ox, joy.oy, JOY_R, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(joy.ox + joy.dx, joy.oy + joy.dy, 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    updateHUD();
  }

  // ===== HUD =====
  let lastSkillKey = '';
  function updateHUD() {
    const p = G.player;
    hudEl.style.display = (G.state === 'playing' || G.state === 'levelup') ? 'flex' : 'none';
    hpFill.style.width = Math.max(0, p.hp / p.maxHp * 100) + '%';
    hpText.textContent = Math.max(0, Math.ceil(p.hp)) + ' / ' + p.maxHp + (p.shield > 0 ? ' (+' + Math.ceil(p.shield) + ')' : '');
    xpFill.style.width = Math.min(100, p.xp / xpForLevel(p.level) * 100) + '%';
    xpText.textContent = Math.floor(p.xp) + ' / ' + xpForLevel(p.level);
    lvlText.textContent = p.level;
    const stg = CONFIG.STAGES[G.stage - 1];
    stageInfo.textContent = '스테이지 ' + G.stage + '/8';
    const remain = Math.max(0, stg.time - G.stageTime);
    timer.textContent = Math.floor(remain / 60) + ':' + String(Math.floor(remain % 60)).padStart(2, '0');
    killsEl.textContent = stg.boss
      ? (G.bossSpawned ? (G.boss ? '👹 보스전  ' : '✔  ') : '보스 대기  ') + G.kills + '/' + stg.clearKills
      : G.kills + '/' + stg.clearKills;
    if (G.boss && G.boss.hp > 0) {
      bossBar.style.display = 'block';
      bossName.textContent = G.boss.type === 'boss' ? '👹 BOSS' : '👹 MINI BOSS';
      bossFill.style.width = Math.max(0, G.boss.hp / G.boss.maxHp * 100) + '%';
      bossHpText.textContent = Math.ceil(G.boss.hp) + ' / ' + Math.round(G.boss.maxHp);
    } else bossBar.style.display = 'none';
    const key = Object.entries(p.skills).map(([k, v]) => k + v).join(',');
    if (key !== lastSkillKey) {
      lastSkillKey = key;
      skillsEl.innerHTML = Object.entries(p.skills).map(([k, v]) =>
        '<div class="skill-icon" title="' + SKILL_NAMES[k] + ' Lv' + v + '">' + iconHtml(k) +
        '<span style="position:absolute;bottom:2px;right:4px;font-size:10px;color:#ffd166">' + v + '</span></div>'
      ).join('');
    }
  }

  // ===== 레벨업 모달 =====
  function openLevelup() {
    G.state = 'levelup';
    currentChoices = rollSkillChoices(G.player, Math.random);
    skillChoices.innerHTML = currentChoices.map((c, i) => {
      const st = skillStats(c.id, c.toLevel);
      const lvLabel = c.toLevel === 1 ? ' (NEW)' : ' Lv' + (c.toLevel - 1) + '→' + c.toLevel;
      return '<div class="skill-choice" data-i="' + i + '">' +
        '<div class="name">' + iconHtml(c.id) + SKILL_NAMES[c.id] + lvLabel + '</div>' +
        '<div class="desc">' + (st ? skillDescLine(c.id, st) : '') + '</div></div>';
    }).join('');
    levelupModal.classList.remove('hidden');
  }
  function chooseSkill(i) {
    const c = currentChoices[i];
    if (!c || G.state !== 'levelup') return;
    G.player.skills[c.id] = c.toLevel;
    G.player.skillTimers[c.id] = 0;
    G.levelupQueue--;
    levelupModal.classList.add('hidden');
    if (G.levelupQueue > 0) openLevelup();
    else G.state = 'playing';
  }
  skillChoices.addEventListener('click', (ev) => {
    const card = ev.target.closest('.skill-choice');
    if (card) chooseSkill(+card.dataset.i);
  });

  // ===== 기록 / 종료 / 승리 =====
  function fmtTime(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function recordStats() {
    const best = Save.load() || { stage: 0, level: 0, kills: 0 };
    const cur = { stage: G.stage, level: G.player.level, kills: G.totalKills, time: Math.floor(G.time) };
    const isRecord = cur.stage > (best.stage || 0) || cur.level > (best.level || 0) || cur.kills > (best.kills || 0);
    if (isRecord) {
      Save.save({
        stage: Math.max(best.stage || 0, cur.stage),
        level: Math.max(best.level || 0, cur.level),
        kills: Math.max(best.kills || 0, cur.kills),
      });
    }
    return { cur, best, isRecord };
  }
  function statsHtml({ cur, best, isRecord }) {
    const badge = isRecord ? '<div style="color:#ffd166;font-weight:bold;margin-bottom:10px">🏆 신기록 달성!</div>' : '';
    return badge +
      '<div class="stat">스테이지 <span>' + cur.stage + ' (최고 ' + (best.stage || 0) + ')</span></div>' +
      '<div class="stat">레벨 <span>' + cur.level + ' (최고 ' + (best.level || 0) + ')</span></div>' +
      '<div class="stat">처치 <span>' + cur.kills + ' (최고 ' + (best.kills || 0) + ')</span></div>' +
      '<div class="stat">잔존 시간 <span>' + fmtTime(cur.time) + '</span></div>';
  }
  function gameOver() {
    if (G.state === 'gameover') return;
    G.state = 'gameover';
    goStats.innerHTML = statsHtml(recordStats());
    gameoverModal.classList.remove('hidden');
    hudEl.style.display = 'none';
  }
  function winGame() {
    if (G.state === 'win') return;
    G.state = 'win';
    winStats.innerHTML = statsHtml(recordStats());
    winModal.classList.remove('hidden');
    hudEl.style.display = 'none';
  }

  // ===== 시작 / 재시작 =====
  function startGame() {
    G = newRun();
    G.state = 'playing';
    G.banner = '스테이지 1'; G.bannerT = 1.8;
    startModal.classList.add('hidden');
    gameoverModal.classList.add('hidden');
    winModal.classList.add('hidden');
    levelupModal.classList.add('hidden');
    lastSkillKey = '##';
  }
  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  winRestartBtn.addEventListener('click', startGame);

  // ===== 입력 =====
  addEventListener('keydown', (ev) => {
    const k = ev.key.toLowerCase();
    if (k === 'r') { startGame(); return; }
    if (G && G.state === 'levelup' && ['1', '2', '3'].includes(k)) { chooseSkill(+k - 1); return; }
    keys[k] = true;
  });
  addEventListener('keyup', (ev) => { keys[ev.key.toLowerCase()] = false; });

  // ===== 터치 컨트롤 (모바일 가상 조이스틱) =====
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  const joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
  const JOY_R = 70, JOY_DEAD = 12;
  function joySetKeys() {
    keys.w = joy.dy < -JOY_DEAD; keys.s = joy.dy > JOY_DEAD;
    keys.a = joy.dx < -JOY_DEAD; keys.d = joy.dx > JOY_DEAD;
  }
  if (isTouch) {
    addEventListener('touchstart', (e) => {
      if (joy.active || e.target !== canvas) return;
      const r = canvas.getBoundingClientRect();
      const t = e.changedTouches[0];
      joy.active = true; joy.id = t.identifier;
      joy.ox = (t.clientX - r.left) * canvas.width / r.width;
      joy.oy = (t.clientY - r.top) * canvas.height / r.height;
      joy.dx = 0; joy.dy = 0;
      e.preventDefault();
    }, { passive: false });
    addEventListener('touchmove', (e) => {
      if (!joy.active) return;
      const r = canvas.getBoundingClientRect();
      for (let i = 0; i < e.touches.length; i++) {
        const t = e.touches[i];
        if (t.identifier !== joy.id) continue;
        let dx = (t.clientX - r.left) * canvas.width / r.width - joy.ox;
        let dy = (t.clientY - r.top) * canvas.height / r.height - joy.oy;
        const len = Math.hypot(dx, dy);
        if (len > JOY_R) { dx = dx / len * JOY_R; dy = dy / len * JOY_R; }
        joy.dx = dx; joy.dy = dy;
      }
      joySetKeys();
      e.preventDefault();
    }, { passive: false });
    const joyEnd = (e) => {
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier !== joy.id) continue;
        joy.active = false; joy.id = -1; joy.dx = 0; joy.dy = 0;
        joySetKeys();
      }
    };
    addEventListener('touchend', joyEnd);
    addEventListener('touchcancel', joyEnd);
  }

  // ===== 게임 루프 =====
  let last = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, last ? (t - last) / 1000 : 0.016);
    last = t;
    if (!G) return;
    if (G.state === 'playing') {
      G.time += dt;
      updateSkills(dt);
      updatePlayer(dt);
      updateEnemies(dt);
      updateProjectiles(dt);
      updatePickups(dt);
      updateStage(dt);
      if (G.player.hp <= 0 && G.state === 'playing') gameOver();
    }
    if (G.state === 'playing' || G.state === 'levelup' || G.state === 'menu') updateParticles(dt);
    if (G.state === 'playing') updateCamera(dt);
    render();
  }

  // ===== 초기화 =====
  G = newRun();
  globalThis.__game = {
    get state() { return G ? G.state : null; },
    get run() { return G; },
    start: startGame,
    chooseSkill: chooseSkill,
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
